<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="nano-harness — smallest readable coding-agent loop that scores on benchmarks">
  <defs>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#3fb950" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.55" r="0.65">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 H0 V34" fill="none" stroke="#3fb950" stroke-width="1" opacity="0.05"/>
    </pattern>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1280" height="360" fill="#0d1117"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>
  <rect width="1280" height="3" fill="url(#topbar)"/>

  <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace">
    <!-- terminal window dots -->
    <circle cx="84" cy="58" r="6" fill="#ff5f56" opacity="0.85"/>
    <circle cx="108" cy="58" r="6" fill="#ffbd2e" opacity="0.85"/>
    <circle cx="132" cy="58" r="6" fill="#27c93f" opacity="0.85"/>

    <!-- prompt line -->
    <text x="82" y="114" font-size="20">
      <tspan fill="#3fb950">~/nano-harness</tspan><tspan fill="#6e7681"> $ </tspan><tspan fill="#8b949e">nano run "fix the failing test"</tspan>
    </text>

    <!-- wordmark -->
    <text x="80" y="212" font-size="84" font-weight="700" letter-spacing="0">
      <tspan fill="#e6edf3">nano-harness</tspan><tspan fill="#3fb950" dx="10">_</tspan>
    </text>

    <!-- tagline -->
    <text x="82" y="254" font-size="22" fill="#8b949e">Smallest readable coding-agent loop that scores on benchmarks.</text>

    <!-- agent loop: bash -> read_file -> edit_file -> (loop) -->
    <g>
      <!-- return arc -->
      <path d="M 418 288 C 418 256, 116 256, 116 286" fill="none" stroke="#3fb950" stroke-width="2" opacity="0.55" marker-end="url(#ah)"/>
      <text x="267" y="252" font-size="13" fill="#6e7681" text-anchor="middle" letter-spacing="1">loop</text>

      <!-- pills -->
      <rect x="82"  y="292" width="66"  height="34" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="115" y="314" font-size="17" fill="#e6edf3" text-anchor="middle">bash</text>

      <rect x="200" y="292" width="116" height="34" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="258" y="314" font-size="17" fill="#e6edf3" text-anchor="middle">read_file</text>

      <rect x="368" y="292" width="108" height="34" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="422" y="314" font-size="17" fill="#e6edf3" text-anchor="middle">edit_file</text>

      <!-- arrows between pills -->
      <line x1="152" y1="309" x2="194" y2="309" stroke="#3fb950" stroke-width="2" marker-end="url(#ah)"/>
      <line x1="320" y1="309" x2="362" y2="309" stroke="#3fb950" stroke-width="2" marker-end="url(#ah)"/>
    </g>

    <!-- right-side stat -->
    <text x="1198" y="150" font-size="72" font-weight="700" fill="#e6edf3" text-anchor="end">~970</text>
    <text x="1198" y="180" font-size="18" fill="#8b949e" text-anchor="end">non-blank lines &#183; 5 files</text>
    <g>
      <rect x="1010" y="204" width="188" height="30" rx="15" fill="#161b22" stroke="#2ea043"/>
      <text x="1104" y="224" font-size="15" fill="#3fb950" text-anchor="middle">score / line-of-code</text>
    </g>
    <text x="1198" y="316" font-size="15" fill="#6e7681" text-anchor="end">Karpathy nano aesthetic &#183; read it in one sitting</text>
  </g>
</svg>
