# Terminal-Bench 2.0 GT ARM: nano-harness + GroundTruth via Harbor.
#
# The only treatment path is eval.tb_agent:GTNanoAgent -> `gt-harness run
# --treatment groundtruth`. It uploads first-party source plus a source-built
# Linux indexer. No wheel, legacy central runner, MCP substitute, or feature
# census is allowed to stand in for the actual treatment receipt.
#
# Why build here instead of downloading: the public groundtruth repo has NO
# binary release assets (tag v1.1.0, which _binary.py's auto-downloader
# targets, does not exist — verified 2026-07-29 via `gh release list`), so the
# in-container download path is dead. Building from the vendored source (the
# exact tree the local runtime was developed against; the public repo's
# gt-index has drifted) is the only deterministic option.
#
# The artifact includes raw run receipts, graph/treatment receipts, grader
# results, and hash-bound evaluated receipts. Transcript text is never used as
# proof that GT was available or delivered.
name: TB2 GT arm (nano + GroundTruth)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Provider-native model id; the DeepSeek gateway requires bare deepseek-v4-flash"
        type: string
        default: "deepseek-v4-flash"
      ref:
        description: "Exact authorized GT commit; blank freezes the dispatch commit"
        type: string
        default: ""
      base_url:
        description: "OpenAI-compatible gateway URL; when set, exported as OPENAI_BASE_URL (overrides the repo secret)"
        type: string
        default: ""
      provider_secret:
        description: "Repository Actions secret name containing the provider key; value is never a dispatch input"
        type: string
        default: "OPENAI_API_KEY"
      n_tasks:
        description: "Slice size (harbor -l). 'all' = full 89-task dataset"
        type: string
        default: "5"
      concurrency:
        description: "Concurrent trials (harbor -n)"
        type: string
        default: "5"
      temperature:
        description: "Explicit OpenAI-compatible sampling temperature"
        type: string
        default: "1"
      job_name:
        description: "Harbor job name (default: auto tb2-gt-<run id>)"
        type: string
        default: ""
      task_ids:
        description: "Comma-separated task IDs; use ALL to select the complete 89-task dataset"
        type: string
        default: "ALL"
      timeout_multiplier:
        description: "harbor --agent-timeout-multiplier. MUST match the baseline arm being paired against (frozen full-89 baseline = 1.0; early smokes = 2.0)"
        type: string
        default: "1.0"

jobs:
  gt:
    runs-on: ubuntu-latest
    # A full 89-task run at -n 4 may not fit even this window; shard it with
    # task_ids across several dispatches if it times out (see workflows README).
    timeout-minutes: 350
    env:
      # Set whichever your model needs: `gh secret set ANTHROPIC_API_KEY` etc.
      # Unset secrets resolve to "" and are simply absent for the agent.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets[inputs.provider_secret] }}
      # Input beats secret; empty means "no gateway" (direct provider APIs).
      OPENAI_BASE_URL: ${{ inputs.base_url != '' && inputs.base_url || secrets.OPENAI_BASE_URL }}
      NANO_TEMPERATURE: ${{ inputs.temperature }}
      PYTHONUTF8: "1"
      GT_INDEX_BINARY_HOST: /tmp/gt-index-linux-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go (for gt-index)
        uses: actions/setup-go@v5
        with:
          go-version-file: vendor/gt-index-src/go.mod
          cache-dependency-path: vendor/gt-index-src/go.sum

      # CGO (mattn/go-sqlite3) + `-tags sqlite_fts5` is MANDATORY: without the
      # tag the FTS tables are silently compiled out and GT's search legs
      # degrade (Groundtruth AGENTS.md §E). gcc ships on ubuntu-latest.
      # Static link first so the binary also runs on musl/alpine task images;
      # fall back to dynamic (glibc-only) with a visible warning.
      - name: Build gt-index (linux-amd64, CGO + sqlite_fts5)
        working-directory: vendor/gt-index-src
        run: |
          set -uo pipefail
          export CGO_ENABLED=1
          if go build -tags sqlite_fts5 \
               -ldflags '-linkmode external -extldflags "-static"' \
               -o /tmp/gt-index-linux-amd64 ./cmd/gt-index/; then
            echo "static build ok"
          else
            echo "::warning::static link failed; falling back to a dynamically linked gt-index (will not run on musl/alpine task images)"
            go build -tags sqlite_fts5 -o /tmp/gt-index-linux-amd64 ./cmd/gt-index/
          fi
          file /tmp/gt-index-linux-amd64 || true
          ldd /tmp/gt-index-linux-amd64 || true

      # Prove the binary indexes AND that FTS5 made it in (the failure mode is
      # silent) before spending a single API dollar.
      - name: Smoke gt-index
        run: |
          set -euo pipefail
          /tmp/gt-index-linux-amd64 -root nano -output /tmp/gt-smoke.db
          python3 - <<'EOF'
          import sqlite3
          names = {r[0] for r in sqlite3.connect("/tmp/gt-smoke.db")
                   .execute("SELECT name FROM sqlite_master")}
          assert {"nodes", "edges"} <= names, f"core tables missing: {names}"
          missing = {"nodes_fts", "symbol_content_fts"} - names
          assert not missing, f"FTS5 tables missing (built without -tags sqlite_fts5?): {missing}"
          print("gt-index smoke ok:", len(names), "tables")
          EOF

      # Ubuntu runners ship ~20-25 GB free on /. TB2 task images are mostly
      # sub-GB but there are 89 distinct ones and harbor keeps pulled images
      # around, so a full run plausibly exhausts the disk. Reclaim the big
      # preinstalled toolchains (~25-30 GB) only for full runs; slices don't
      # need it and this step costs a couple of minutes.
      - name: Free disk space (full runs only)
        if: ${{ inputs.n_tasks == 'all' && inputs.task_ids == '' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af

      - name: Install nano-harness + harbor
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,eval,miniswe,gt]' "harbor==0.20.0"

      - name: Fail closed unless this exact product release authorizes paid execution
        env:
          MODEL: ${{ inputs.model }}
          BASE_URL: ${{ inputs.base_url != '' && inputs.base_url || secrets.OPENAI_BASE_URL }}
          PROVIDER_SECRET: ${{ inputs.provider_secret }}
          TASK_IDS: ${{ inputs.task_ids }}
          TEMPERATURE: ${{ inputs.temperature }}
          TIMEOUT_MULT: ${{ inputs.timeout_multiplier }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          python -m scripts.release_workflow_guard \
            --manifest eval/release/ox_alpha_smoke20.json \
            --workflow tb2_gt.yml \
            --runtime-sha "$(git rev-parse HEAD)" \
            --model "$MODEL" \
            --base-url "$BASE_URL" \
            --provider-secret "$PROVIDER_SECRET" \
            --task-ids "$TASK_IDS" \
            --temperature "$TEMPERATURE" \
            --timeout-multiplier "$TIMEOUT_MULT" \
            --concurrency "$CONCURRENCY"

      - name: Prove the provider-free product boundary before provider spend
        env:
          GT_INDEX_BINARY: /tmp/gt-index-linux-amd64
        run: |
          pytest -m 'not external_evidence' -q
          (cd vendor/gt-index-src && go test ./...)

      # Substrate-era assumption, corrected: credentials used to be baked ONCE
      # into the substrate image; now every dispatch re-imports them from
      # secrets, so every credential-shaped secret must be sanitized per run.
      # A BOM-carrying key dies at httpx's ASCII header encode (GHA run
      # 30496848157); a CR/LF-carrying base URL dies as a generic
      # APIConnectionError (runs 30500833711 + 30501029611). Strip + re-mask +
      # re-export ALL of them, keys AND the gateway URL.
      - name: Sanitize provider secrets (BOM / whitespace / CRLF)
        run: |
          python - <<'EOF'
          import os, sys

          cleaned, notes = [], []
          for name in ("OPENAI_API_KEY", "ANTHROPIC_API_KEY", "OPENAI_BASE_URL"):
              raw = os.environ.get(name) or ""
              if not raw:
                  continue
              clean = raw.replace("\ufeff", "").strip()
              if clean != raw:
                  notes.append(f"{name}: removed {len(raw) - len(clean)} stray "
                               "char(s) (BOM/whitespace/CRLF); re-set the secret to fix at source")
              if not clean.isascii():
                  print(f"::error::{name} still holds non-ASCII characters after "
                        "stripping - it cannot be sent in an HTTP request")
                  sys.exit(1)
              cleaned.append((name, clean))

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for name, clean in cleaned:
                  print(f"::add-mask::{clean}")
                  f.write(f"{name}={clean}\n")
          for n in notes:
              print(f"::warning::{n}")
          print(f"sanitized {len(cleaned)} value(s); {len(notes)} needed repair")
          EOF

      # One ~1k-token call (<$0.001) through nano's OWN provider routing before
      # harbor pulls a single task image. Would have failed run 30496848157 for
      # under a cent instead of five dead containers. Model-prefix handling
      # mirrors eval/tb_agent.py _model_and_env (strip "provider/" only when no
      # OPENAI_BASE_URL gateway is configured).
      - name: Preflight provider (fail fast, not 5 dead containers)
        env:
          MODEL: ${{ inputs.model }}
        run: |
          python - <<'EOF'
          import os, sys
          from nano.cli import build_provider
          from nano.prompts import SYSTEM_PROMPT
          from nano.tools import TOOLS

          model = os.environ["MODEL"]
          base = os.environ.get("OPENAI_BASE_URL") or ""
          if not base:
              model = model.split("/", 1)[-1]
          print(f"model={model!r} OPENAI_BASE_URL={base or '(unset)'}")
          # 3 attempts with backoff: one transient runner->gateway blip must
          # not kill a dispatch (two real dispatches died on a single
          # APIConnectionError). Print the exception CAUSE chain - openai's
          # "Connection error." hides the DNS/SSL/URL detail needed to
          # distinguish a bad secret from a network blip.
          import time
          last = None
          for attempt in range(1, 4):
              try:
                  provider = build_provider(
                      model=model,
                      base_url=base or None,
                      temperature=float(os.environ["NANO_TEMPERATURE"]),
                  )
                  r = provider.step(
                      messages=[{"role": "user", "content": "Reply with the single word: ok"}],
                      tools=TOOLS, system=SYSTEM_PROMPT,
                  )
                  break
              except Exception as e:
                  last = e
                  chain = []
                  c = e
                  while c is not None and len(chain) < 5:
                      chain.append(f"{type(c).__name__}: {c}")
                      c = c.__cause__ or c.__context__
                  print(f"attempt {attempt}/3 failed: " + " <- ".join(chain))
                  time.sleep(5 * attempt)
          else:
              print(f"::error::preflight failed after 3 attempts: "
                    f"{type(last).__name__}: {last}")
              print("The model id, API key, or gateway is wrong - fix it before "
                    "spending a run. No task images were pulled.")
              sys.exit(1)
          print(f"preflight ok: stop_reason={r.stop_reason} usage={r.usage} "
                f"text={(r.text or '')[:80]!r} tool_calls={len(r.tool_calls)}")
          EOF

      # GTNanoAgent fail-fasts when the source-built binary is missing; surface
      # the same check here before Harbor spends anything.
      - name: Preflight GT artifacts
        run: |
          set -euo pipefail
          test -x /tmp/gt-index-linux-amd64
          python - <<'EOF'
          from eval.tb_agent import GTNanoAgent
          print("binary:", GTNanoAgent._gt_binary_host())
          EOF

      - name: Verify complete TB2 task cardinality
        if: ${{ inputs.n_tasks == 'all' && inputs.task_ids == 'ALL' }}
        run: |
          set -euo pipefail
          harbor dataset download terminal-bench@2.0 -o tb2-cardinality --export
          python - <<'PY'
          from pathlib import Path

          root = Path("tb2-cardinality/terminal-bench")
          tasks = sorted(path.name for path in root.iterdir() if path.is_dir())
          if len(tasks) != 89:
              raise SystemExit(f"expected exactly 89 TB2 tasks, found {len(tasks)}")
          print(f"TB2 task cardinality verified: {len(tasks)}")
          PY

      - name: Disk before run
        run: df -h /

      - name: Run harbor (Terminal-Bench 2.0)
        id: harbor
        env:
          MODEL: ${{ inputs.model }}
          N_TASKS: ${{ inputs.n_tasks }}
          CONCURRENCY: ${{ inputs.concurrency }}
          JOB_NAME_INPUT: ${{ inputs.job_name }}
          TASK_IDS: ${{ inputs.task_ids }}
          TIMEOUT_MULT: ${{ inputs.timeout_multiplier }}
        run: |
          set -uo pipefail
          JOB_NAME="${JOB_NAME_INPUT:-tb2-gt-${GITHUB_RUN_ID}}"
          echo "job_name=${JOB_NAME}" >> "$GITHUB_OUTPUT"

          # Pairing law: the GT arm must run the SAME timeout budget as the
          # baseline arm it is compared against (the frozen full-89 baseline
          # used harbor's default 1.0; the early 5-task smokes used 2.0).
          export GT_AGENT_TIMEOUT_SECONDS="$(
            python -c 'import sys; print(1800 * float(sys.argv[1]))' \
              "${TIMEOUT_MULT:-1.0}"
          )"
          args=( run
            -d terminal-bench@2.0
            -a eval.tb_agent:GTNanoAgent
            -m "$MODEL"
            -o results/terminal-bench
            --job-name "$JOB_NAME"
            --agent-timeout-multiplier "${TIMEOUT_MULT:-1.0}"
            -n "$CONCURRENCY"
            -y
          )
          if [ -n "$TASK_IDS" ] && [ "$TASK_IDS" != "ALL" ]; then
            IFS=',' read -ra ids <<< "$TASK_IDS"
            for id in "${ids[@]}"; do
              id="$(echo "$id" | xargs)"   # trim whitespace
              [ -n "$id" ] && args+=( -i "$id" )
            done
          elif [ "$N_TASKS" != "all" ]; then
            args+=( -l "$N_TASKS" )
          fi

          harbor "${args[@]}"

      - name: Normalize Harbor result ownership for binding and upload
        if: ${{ always() && steps.harbor.outcome != 'skipped' }}
        env:
          JOB_NAME: ${{ steps.harbor.outputs.job_name }}
        run: |
          set -euo pipefail
          run_dir="results/terminal-bench/${JOB_NAME}"
          case "$run_dir" in
            results/terminal-bench/*) ;;
            *) echo "unsafe Harbor result path: $run_dir" >&2; exit 1 ;;
          esac
          test -d "$run_dir"
          sudo chown -R "$(id -u):$(id -g)" "$run_dir"
          chmod -R u+rwX,go+rX "$run_dir"

      - name: Disk after run
        if: always()
        run: df -h /

      - name: Bind grader outcomes and verify actual GT treatment delivery
        if: ${{ always() && steps.harbor.outcome != 'skipped' }}
        env:
          JOB_NAME: ${{ steps.harbor.outputs.job_name }}
        run: |
          set -euo pipefail
          run_dir="results/terminal-bench/${JOB_NAME}"
          gt-harness record-harbor-outcomes \
            --harbor-run-dir "$run_dir" \
            --output-dir "$run_dir/evaluated-receipts" \
            | tee "$run_dir/evaluated-receipts-summary.json"
          python - "$run_dir/evaluated-receipts" <<'PY'
          import json, sys
          from pathlib import Path

          receipts = [
              json.loads(path.read_text(encoding="utf-8"))
              for path in sorted(Path(sys.argv[1]).glob("*.json"))
          ]
          if not receipts:
              raise SystemExit("no evaluated GT run receipts")
          failures = []
          active = 0
          not_applicable = 0
          for row in receipts:
              gt = row.get("treatment_receipt") or {}
              key = f"{row.get('task_id')}::{row.get('trial_id')}"
              if row.get("status") != "COMPLETED":
                  failures.append(f"{key}:run_not_completed")
              status = gt.get("treatment_status")
              if status == "ACTIVE":
                  active += 1
                  if gt.get("graph_status") not in {"READY", "READY_WITH_DECLARED_LIMITATIONS"}:
                      failures.append(f"{key}:graph_not_ready")
                  if int(gt.get("delivery_count") or 0) < 1:
                      failures.append(f"{key}:context_not_delivered")
                  if int(gt.get("evidence_items_delivered") or 0) < 1:
                      failures.append(f"{key}:evidence_not_delivered")
                  if gt.get("graph_commit_sha") != (row.get("repository_end") or {}).get("commit_sha"):
                      failures.append(f"{key}:graph_commit_mismatch")
                  if gt.get("source_revision") != (row.get("repository_end") or {}).get("source_revision"):
                      failures.append(f"{key}:graph_source_revision_mismatch")
              elif status == "NOT_APPLICABLE":
                  not_applicable += 1
                  if int(gt.get("delivery_count") or 0) != 0:
                      failures.append(f"{key}:not_applicable_but_context_delivered")
              else:
                  failures.append(f"{key}:treatment_failed:{status}")
          if failures:
              raise SystemExit("invalid GT treatment:\n" + "\n".join(failures))
          print(
              f"verified {len(receipts)} evaluated receipt(s): "
              f"ACTIVE={active}, NOT_APPLICABLE={not_applicable}"
          )
          PY

      # Upload grader results, raw run receipts, hash-bound evaluated receipts,
      # transcripts, patches, and exact treatment/graph receipts.
      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb2-gt-${{ github.run_id }}
          path: results/terminal-bench/
          if-no-files-found: warn

      - name: Score summary
        if: always()
        env:
          JOB_NAME: ${{ steps.harbor.outputs.job_name }}
        run: |
          python - <<'EOF'
          import json, os
          from pathlib import Path

          job = os.environ.get("JOB_NAME", "")
          path = Path("results/terminal-bench") / job / "result.json"
          out = [f"## TB2 GT arm: `{job}`", ""]
          if not path.is_file():
              out.append(f"No result.json at `{path}` - harbor did not finish. "
                         "Check the run logs and the uploaded artifact.")
          else:
              r = json.loads(path.read_text(encoding="utf-8"))
              stats = r.get("stats", {})
              out += [
                  f"- total trials: **{r.get('n_total_trials', '?')}**",
                  f"- completed: **{stats.get('n_completed_trials', '?')}**"
                  f", errored: **{stats.get('n_errored_trials', '?')}**",
              ]
              # stats.evals["<agent>__<model>__<dataset>"].reward_stats maps
              # reward name -> {value: [trial names]} (harbor 0.20 schema).
              for key, ev in (stats.get("evals") or {}).items():
                  out.append(f"\n### {key}")
                  for reward, by_val in (ev.get("reward_stats") or {}).items():
                      total = sum(len(v) for v in by_val.values())
                      solved = sum(len(v) for val, v in by_val.items()
                                   if float(val) >= 1)
                      pct = f"{100 * solved / total:.1f}%" if total else "n/a"
                      out.append(f"- **{reward}**: {solved}/{total} ({pct})")
                  for k, v in (ev.get("pass_at_k") or {}).items():
                      out.append(f"- pass@{k}: {v}")
              rows = []
              for t in r.get("trial_results", []):
                  name = t.get("task_name") or t.get("trial_name", "?")
                  vr = t.get("verifier_result") or {}
                  rewards = vr.get("rewards")
                  exc = (t.get("exception_info") or {}).get("exception_type")
                  status = json.dumps(rewards) if rewards else (exc or "no reward")
                  rows.append(f"| {name} | {status} |")
              if rows:
                  out += ["", "| task | rewards |", "|---|---|"] + rows
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(out) + "\n")
          EOF
