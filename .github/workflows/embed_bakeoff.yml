name: "Embed bakeoff: dense retriever comparison"

on:
  workflow_dispatch:
  push:
    branches: [embed-bakeoff]

permissions:
  contents: read

jobs:
  bakeoff:
    name: "bakeoff / ${{ matrix.task }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        task:
          - abs-module-cache-flags
          - adaptix-name-mapping-aliases
          - arktype-json-schema-refs-dependencies
          - csstree-shorthand-expansion-compression
          - boa-hierarchical-evaluation-cancellation
          - abs-stepped-slices
          - aiomonitor-task-snapshots-diff
          - awilix-async-container-initialization
          - katex-multicolumn-array-spans
          - fd-deterministic-multi-key-sorting
        model:
          - qodo_1_5b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: datacurve-ai/deep-swe
          ref: 435ee89ec2f2e2289f33b0da4f992f0b7b7266b9
          path: deepswe-bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install embedders
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.1
          if [ "${{ matrix.model }}" = "qodo_1_5b" ]; then
            # Qodo's remote modeling_qwen.py needs the pre-4.44 cache API
            pip install sentence-transformers==3.3.1 transformers==4.43.4 numpy
          else
            pip install sentence-transformers==5.1.2 transformers==4.57.1 numpy
          fi
      - name: Run bakeoff for ${{ matrix.task }} / ${{ matrix.model }}
        run: |
          python scripts/embed_bakeoff.py \
            --task "${{ matrix.task }}" \
            --model "${{ matrix.model }}" \
            --tasks-root deepswe-bench/tasks \
            --out results-${{ matrix.task }}-${{ matrix.model }}.jsonl \
            --repos repos
      - uses: actions/upload-artifact@v4
        with:
          name: bakeoff-${{ matrix.task }}-${{ matrix.model }}
          path: results-${{ matrix.task }}-${{ matrix.model }}.jsonl
          if-no-files-found: warn
          retention-days: 14

  collect:
    name: "merge + summarize"
    needs: bakeoff
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bakeoff-*
          merge-multiple: true
      - name: Merge results
        run: |
          cat results-*.jsonl > results-merged.jsonl 2>/dev/null || true
          python - <<'EOF'
          import json
          META = {"task", "files", "chunks", "gold"}
          tasks, models = {}, set()
          for line in open("results-merged.jsonl"):
              line = line.strip()
              if not line:
                  continue
              try:
                  r = json.loads(line)
              except json.JSONDecodeError:
                  continue
              row = tasks.setdefault(r["task"], dict(r))
              for k in r:
                  if k not in META:
                      row[k] = r[k]
                      models.add(k)
          agg = {}
          for m in sorted(models):
              rows = [t[m] for t in tasks.values() if m in t]
              for k in ("recall@10", "recall@20", "recall@50"):
                  agg[f"{m} {k}"] = round(
                      sum(r[k] for r in rows) / max(1, len(rows)), 4)
              agg[f"{m} ms/chunk"] = round(
                  sum(r["ms_per_chunk"] for r in rows) / max(1, len(rows)), 1)
          print(json.dumps({"tasks": len(tasks), "aggregate": agg}, indent=2))
          for t, r in sorted(tasks.items()):
              bits = "  ".join(
                  f"{m} r@20={r[m]['recall@20']:.2f}" for m in sorted(models) if m in r)
              print(f"{t}: files={r['files']} gold={r['gold']} {bits}")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: bakeoff-merged
          path: results-merged.jsonl
          if-no-files-found: warn
          retention-days: 30
