# Terminal-Bench 2.0 BASELINE: stock nano-harness (no GroundTruth) via Harbor.
#
# Validated against harbor==0.20.0 (flags -d/-a/-m/-l/-n/-o/--job-name/
# --agent-timeout-multiplier/-y/-i all confirmed via `harbor run --help` and a
# `--print-config` dry run with the exact invocation below).
#
# A GT-arm workflow will follow later (blocked on container plumbing in
# eval/tb_agent.py install(); see the TODO(gt) there). Keep this file
# baseline-only: when the GT arm lands it gets its own workflow (or a
# gt_enabled input) so the frozen baseline stays reproducible.
name: TB2 baseline (nano, no GT)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model name in provider/name form (harbor -m)"
        type: string
        default: "deepseek/deepseek-v4-flash"
      base_url:
        description: "OpenAI-compatible gateway URL; when set, exported as OPENAI_BASE_URL (overrides the repo secret)"
        type: string
        default: ""
      n_tasks:
        description: "Slice size (harbor -l). 'all' = full 89-task dataset"
        type: string
        default: "5"
      concurrency:
        description: "Concurrent trials (harbor -n)"
        type: string
        default: "4"
      job_name:
        description: "Harbor job name (default: auto tb2-baseline-<run id>)"
        type: string
        default: ""
      task_ids:
        description: "Optional comma-separated task names (harbor -i, glob ok). Overrides n_tasks — use to shard a full run manually"
        type: string
        default: ""

jobs:
  baseline:
    runs-on: ubuntu-latest
    # A full 89-task run at -n 4 may not fit even this window; shard it with
    # task_ids across several dispatches if it times out (see workflows README).
    timeout-minutes: 350
    env:
      # Set whichever your model needs: `gh secret set ANTHROPIC_API_KEY` etc.
      # Unset secrets resolve to "" and are simply absent for the agent.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Input beats secret; empty means "no gateway" (direct provider APIs).
      OPENAI_BASE_URL: ${{ inputs.base_url != '' && inputs.base_url || secrets.OPENAI_BASE_URL }}
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Ubuntu runners ship ~20-25 GB free on /. TB2 task images are mostly
      # sub-GB but there are 89 distinct ones and harbor keeps pulled images
      # around, so a full run plausibly exhausts the disk. Reclaim the big
      # preinstalled toolchains (~25-30 GB) only for full runs; slices don't
      # need it and this step costs a couple of minutes.
      - name: Free disk space (full runs only)
        if: ${{ inputs.n_tasks == 'all' && inputs.task_ids == '' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af

      - name: Install nano-harness + harbor
        run: |
          python -m pip install --upgrade pip
          pip install -e . "harbor==0.20.0"

      - name: Disk before run
        run: df -h /

      - name: Run harbor (Terminal-Bench 2.0)
        id: harbor
        env:
          MODEL: ${{ inputs.model }}
          N_TASKS: ${{ inputs.n_tasks }}
          CONCURRENCY: ${{ inputs.concurrency }}
          JOB_NAME_INPUT: ${{ inputs.job_name }}
          TASK_IDS: ${{ inputs.task_ids }}
        run: |
          set -uo pipefail
          JOB_NAME="${JOB_NAME_INPUT:-tb2-baseline-${GITHUB_RUN_ID}}"
          echo "job_name=${JOB_NAME}" >> "$GITHUB_OUTPUT"

          args=( run
            -d terminal-bench@2.0
            -a eval.tb_agent:NanoAgent
            -m "$MODEL"
            -o results/terminal-bench
            --job-name "$JOB_NAME"
            --agent-timeout-multiplier 2.0
            -n "$CONCURRENCY"
            -y
          )
          if [ -n "$TASK_IDS" ]; then
            IFS=',' read -ra ids <<< "$TASK_IDS"
            for id in "${ids[@]}"; do
              id="$(echo "$id" | xargs)"   # trim whitespace
              [ -n "$id" ] && args+=( -i "$id" )
            done
          elif [ "$N_TASKS" != "all" ]; then
            args+=( -l "$N_TASKS" )
          fi

          harbor "${args[@]}"

      - name: Disk after run
        if: always()
        run: df -h /

      # Everything harbor wrote: result.json plus per-task dirs with the agent
      # transcript (<task>/agent/nano.txt), verifier output, and config.
      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb2-baseline-${{ github.run_id }}
          path: results/terminal-bench/
          if-no-files-found: warn

      - name: Score summary
        if: always()
        env:
          JOB_NAME: ${{ steps.harbor.outputs.job_name }}
        run: |
          python - <<'EOF'
          import json, os
          from pathlib import Path

          job = os.environ.get("JOB_NAME", "")
          path = Path("results/terminal-bench") / job / "result.json"
          out = [f"## TB2 baseline: `{job}`", ""]
          if not path.is_file():
              out.append(f"No result.json at `{path}` - harbor did not finish. "
                         "Check the run logs and the uploaded artifact.")
          else:
              r = json.loads(path.read_text(encoding="utf-8"))
              stats = r.get("stats", {})
              out += [
                  f"- total trials: **{r.get('n_total_trials', '?')}**",
                  f"- completed: **{stats.get('n_completed_trials', '?')}**"
                  f", errored: **{stats.get('n_errored_trials', '?')}**",
              ]
              # stats.evals["<agent>__<model>__<dataset>"].reward_stats maps
              # reward name -> {value: [trial names]} (harbor 0.20 schema).
              for key, ev in (stats.get("evals") or {}).items():
                  out.append(f"\n### {key}")
                  for reward, by_val in (ev.get("reward_stats") or {}).items():
                      total = sum(len(v) for v in by_val.values())
                      solved = sum(len(v) for val, v in by_val.items()
                                   if float(val) >= 1)
                      pct = f"{100 * solved / total:.1f}%" if total else "n/a"
                      out.append(f"- **{reward}**: {solved}/{total} ({pct})")
                  for k, v in (ev.get("pass_at_k") or {}).items():
                      out.append(f"- pass@{k}: {v}")
              rows = []
              for t in r.get("trial_results", []):
                  name = t.get("task_name") or t.get("trial_name", "?")
                  vr = t.get("verifier_result") or {}
                  rewards = vr.get("rewards")
                  exc = (t.get("exception_info") or {}).get("exception_type")
                  status = json.dumps(rewards) if rewards else (exc or "no reward")
                  rows.append(f"| {name} | {status} |")
              if rows:
                  out += ["", "| task | rewards |", "|---|---|"] + rows
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(out) + "\n")
          EOF
