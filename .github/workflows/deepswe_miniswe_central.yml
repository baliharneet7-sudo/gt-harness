# DeepSWE GT-on entry point.
#
# GitHub only dispatches a workflow whose FILE exists on the default branch,
# and runs the version on the ref it is dispatched with. This filename is
# registered on every account's repository, so it is the stable handle:
#   gh workflow run deepswe_miniswe_central.yml --ref integ/gt-attached -f model=...
# It forwards verbatim to deepswe_gt_delivery_ab.yml - the certified GT-on
# pipeline (both arms GT-on; no GT-off arm exists there or here). The old
# host-owned central lane this file used to carry called scripts absent from
# this lineage and ran mini-swe 2.2.8; it is retired, not mirrored.
name: DeepSWE GT-on (certified product, launch-time model)
run-name: "DeepSWE GT-on | ${{ inputs.model }} | arms ${{ inputs.arms }} | tasks ${{ inputs.tasks }}"

on:
  workflow_dispatch:
    inputs:
      approve_paid_run:
        description: "Explicit approval for authenticated paid provider requests"
        required: false
        type: boolean
        default: false
      tasks:
        description: "control10 | all | comma-separated task ids (legs must stay <= 256)"
        required: false
        type: string
        default: "control10"
      arms:
        description: "Delivery arms"
        required: false
        type: choice
        options: [both, push, attached]
        default: "both"
      n_runs:
        description: "Runs per task per arm"
        required: false
        type: string
        default: "4"
      max_parallel:
        description: "Concurrent legs (rate limiting contaminated earlier runs at 9)"
        required: false
        type: string
        default: "3"
      model:
        description: "OpenRouter model id chosen at launch (bare id, e.g. stealth/space-bunny-alpha)"
        required: true
        type: string
      provider_only:
        description: "Comma list of OpenRouter provider tags; empty = template/none"
        required: false
        type: string
        default: ""
      quantization:
        description: "Comma list of required quantizations (e.g. fp8); empty = none"
        required: false
        type: string
        default: ""
      allow_fallbacks:
        description: "Allow OpenRouter provider fallbacks when provider_only is set"
        required: false
        type: boolean
        default: false
      reasoning_effort:
        description: "minimal|low|medium|high|xhigh|max; empty = not sent (the leaderboard row records\
  \ its own)"
        required: false
        type: string
        default: ""
      temperature:
        description: "Sampling temperature"
        required: false
        type: string
        default: "1.0"
      step_limit:
        description: "Agent step limit; 0 = time budget only"
        required: false
        type: string
        default: "300"
      provider_failure_threshold:
        description: "Pre-declared: legs with more provider_failed_calls are excluded"
        required: false
        type: string
        default: "10"
      readiness_run_id:
        description: "Completed provider-free readiness workflow run ID (reuse; no rerun)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  gt_on:
    uses: ./.github/workflows/deepswe_gt_delivery_ab.yml
    secrets: inherit
    with:
      approve_paid_run: ${{ inputs.approve_paid_run }}
      tasks: ${{ inputs.tasks }}
      arms: ${{ inputs.arms }}
      n_runs: ${{ inputs.n_runs }}
      max_parallel: ${{ inputs.max_parallel }}
      model: ${{ inputs.model }}
      provider_only: ${{ inputs.provider_only }}
      quantization: ${{ inputs.quantization }}
      allow_fallbacks: ${{ inputs.allow_fallbacks }}
      reasoning_effort: ${{ inputs.reasoning_effort }}
      temperature: ${{ inputs.temperature }}
      step_limit: ${{ inputs.step_limit }}
      provider_failure_threshold: ${{ inputs.provider_failure_threshold }}
      readiness_run_id: ${{ inputs.readiness_run_id }}
