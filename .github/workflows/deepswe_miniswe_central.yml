# DeepSWE v1.1 catalog-compatible ten-task diagnostic smoke for the current
# host-owned central runtime.  The upstream repository has no v1.1 tag; this
# workflow pins the immutable main snapshot whose 113 task IDs match the
# published v1.1 catalog.
# The v1.1 task contract is executed by the pinned Pier runner.  Pier is the
# Harbor-compatible orchestrator that creates the separate verifier environment,
# runs verifier.collect hooks (including the commit-to-patch collector), and
# grades the pristine verifier checkout.  Mini-SWE still runs through the
# host-owned eval.gt_central_agent:MiniSweCentralAgent import.
name: DeepSWE Mini-SWE central ten-task smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: "DeepSeek V4 Flash model id passed to litellm"
        type: string
        required: true
        default: "deepseek-v4-flash"
      parallel:
        description: "Maximum concurrent DeepSWE tasks"
        type: string
        required: true
        default: "10"
      task_ids:
        description: "Optional comma-separated DeepSWE v1.1 catalog task IDs; empty selects two per language"
        type: string
        required: false
        default: ""
      step_limit:
        description: "Mini-SWE model-call limit per task (DeepSWE parity is 300)"
        type: string
        required: true
        default: "300"
      ref:
        description: "Current GT commit/ref to evaluate"
        type: string
        required: true
        default: "baseline-swe-live-lite-v4flash0731"

permissions:
  contents: read
  packages: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"
  GT_REQUIRE_FULL_POTENTIAL: "1"
  GT_REQUIRE_FTS5: "1"
  GT_FORCE_ONNX_EMBEDDER: "1"
  GT_REQUIRE_EMBEDDER: "1"
  GT_REQUIRE_COMMIT_PARITY: "1"
  GT_RRF_FUSION: "on"
  GT_LOC_FUSION_V2: "1"
  GT_LOC_BEHAVIOR_LEAD: "0"
  SNOWFLAKE_MODEL_REVISION: 7802add0519e4bf94c46ef23552176697c7a1ac7
  SNOWFLAKE_MODEL_SHA256: 564e6c65ee0c739a486702e9e3e9b33c3f697c19c34dbe886bce9eec497ce971
  SNOWFLAKE_TOKENIZER_SHA256: 91f1def9b9391fdabe028cd3f3fcc4efd34e5d1f08c3bf2de513ebb5911a1854
  GT_DENSE_INTRA_OP_THREADS: "4"
  GT_DENSE_INTER_OP_THREADS: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tasks: ${{ steps.select.outputs.tasks }}
      bench_sha: ${{ steps.bench.outputs.sha }}
    env:
      TASK_IDS: ${{ inputs.task_ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Checkout pinned DeepSWE task set
        uses: actions/checkout@v4
        with:
          repository: datacurve-ai/deep-swe
          ref: 435ee89ec2f2e2289f33b0da4f992f0b7b7266b9
          path: deepswe-bench
      - name: Prove DeepSWE v1.1 catalog-compatible provenance
        id: bench
        working-directory: deepswe-bench
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          test "$sha" = "435ee89ec2f2e2289f33b0da4f992f0b7b7266b9" || {
            echo "::error::unexpected DeepSWE v1.1 catalog snapshot: $sha"; exit 1;
          }
          test "$(find tasks -mindepth 2 -maxdepth 2 -name task.toml | wc -l)" -eq 113 || {
            echo "::error::DeepSWE v1.1 catalog snapshot must contain 113 tasks"; exit 1;
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Select ten balanced DeepSWE tasks
        id: select
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, tomllib
          from pathlib import Path

          root = Path("deepswe-bench/tasks")
          explicit = [x.strip() for x in os.environ.get("TASK_IDS", "").split(",") if x.strip()]
          rows = []
          for p in sorted(root.iterdir()):
              cfg = p / "task.toml"
              if not p.is_dir() or not cfg.is_file():
                  continue
              with cfg.open("rb") as fh:
                  data = tomllib.load(fh)
              rows.append((p.name, str((data.get("metadata") or {}).get("language") or "unknown")))
          names = {name for name, _ in rows}
          if explicit:
              missing = sorted(set(explicit) - names)
              if missing or len(explicit) != 10:
                  raise SystemExit(f"explicit DeepSWE smoke requires exactly 10 valid IDs; missing={missing}")
              selected = explicit
          else:
              by_lang = {}
              for name, lang in rows:
                  by_lang.setdefault(lang, []).append(name)
              langs = [lang for lang in ("go", "python", "typescript", "javascript", "rust") if lang in by_lang]
              if len(langs) != 5:
                  raise SystemExit(f"expected five DeepSWE language families, got {sorted(by_lang)}")
              selected = [name for lang in langs for name in by_lang[lang][:2]]
              if len(selected) != 10:
                  raise SystemExit(f"balanced selection produced {len(selected)} tasks")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("tasks=" + json.dumps(selected, separators=(",", ":")) + "\n")
          summary = "## DeepSWE smoke task set\n\n" + "\n".join(f"- `{x}`" for x in selected)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(summary + "\n")
          print(summary)

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix:
        task: ${{ fromJson(needs.plan.outputs.tasks) }}
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODEL: ${{ inputs.model }}
      TASK: ${{ matrix.task }}
      STEP_LIMIT: ${{ inputs.step_limit }}
      GT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Checkout pinned DeepSWE task set
        uses: actions/checkout@v4
        with:
          repository: datacurve-ai/deep-swe
          ref: 435ee89ec2f2e2289f33b0da4f992f0b7b7266b9
          path: deepswe-bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/gt-index-src/go.mod
          cache-dependency-path: vendor/gt-index-src/go.sum
      - name: Build current GT index with FTS5
        working-directory: vendor/gt-index-src
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          go build -tags sqlite_fts5 -o "$RUNNER_TEMP/gt-index" ./cmd/gt-index/
          chmod +x "$RUNNER_TEMP/gt-index"
          echo "GT_INDEX_BINARY=$RUNNER_TEMP/gt-index" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/gt-index" -h >/dev/null 2>&1 || true
      - name: Install current central runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[retrieval]' "mini-swe-agent==2.2.8" "harbor==0.20.0" "datacurve-pier==0.3.1" pytest pytest-asyncio \
            vendor/groundtruth_mcp-*.whl
          test "$(python -c 'import importlib.metadata as m; print(m.version("datacurve-pier"))')" = "0.3.1"
      - name: Provision and verify pinned Snowflake ONNX backend
        run: |
          set -euo pipefail
          model_dir="$RUNNER_TEMP/snowflake-arctic-embed-m"
          mkdir -p "$model_dir"
          gh release download gt-retrieval-runtime-v1 --repo harneet2512/gt-harness \
            --pattern model.onnx --pattern tokenizer.json --pattern manifest.json --dir "$model_dir"
          echo "$SNOWFLAKE_MODEL_SHA256  $model_dir/model.onnx" | sha256sum -c -
          echo "$SNOWFLAKE_TOKENIZER_SHA256  $model_dir/tokenizer.json" | sha256sum -c -
          MODEL_DIR="$model_dir" python - <<'PY'
          import json, os
          from pathlib import Path
          from gt_engine.snowflake_onnx import SnowflakeOnnxDenseBackend
          root = Path(os.environ["MODEL_DIR"])
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest.get("model") == "Snowflake/snowflake-arctic-embed-m"
          assert manifest.get("revision") == os.environ["SNOWFLAKE_MODEL_REVISION"]
          assert manifest.get("inference_api") is False
          backend = SnowflakeOnnxDenseBackend.from_directory(root)
          q, d = backend.embed_query("repository implementation"), backend.embed_documents(("def implementation(): pass",))[0]
          assert q and d and not (backend.receipt().get("network_calls") or backend.receipt().get("provider_calls"))
          Path("dense-backend-proof.json").write_text(json.dumps({"identity": backend.identity, "available": True, "receipt": backend.receipt()}, indent=2) + "\n", encoding="utf-8")
          print(backend.identity)
          PY
          echo "MODEL_DIR=$model_dir" >> "$GITHUB_ENV"
      - name: Prove current provider-free runtime before task execution
        run: |
          set -euo pipefail
          # GITHUB_ENV is available to later steps, but make the exact
          # source-built binary explicit for every subprocess in this proof
          # step.  The strict pytest child must not fall back to the stale
          # wheel/cache binary.
          export GT_INDEX_BINARY="$RUNNER_TEMP/gt-index"
          test -x "$GT_INDEX_BINARY"
          python scripts/verify_gt_index_runtime.py
          python scripts/central_readiness_audit.py
          python scripts/central_pre_smoke_gate.py
      - name: Sanitize provider credentials
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys
          names = ("OPENROUTER_API_KEY", "OPENAI_API_KEY", "ANTHROPIC_API_KEY")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              for name in names:
                  raw = os.environ.get(name) or ""
                  if not raw:
                      continue
                  clean = raw.replace("\ufeff", "").strip()
                  if not clean.isascii():
                      raise SystemExit(f"{name} contains non-ASCII header data")
                  print(f"::add-mask::{clean}")
                  out.write(f"{name}={clean}\n")
          PY
      - name: Resolve exact DeepSWE task budget
        run: |
          set -euo pipefail
          python scripts/resolve_harbor_budget.py \
            --task-config "deepswe-bench/tasks/$TASK/task.toml" \
            --multiplier 1.0 --output "deepswe-budget-$TASK.json"
      - name: Provider preflight
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}${OPENAI_API_KEY:-}${ANTHROPIC_API_KEY:-}" || {
            echo "::error::no provider credential configured"; exit 1;
          }
          MODEL="$MODEL" python - <<'PY'
          import os, litellm
          m = os.environ["MODEL"]
          r = litellm.completion(model=m, messages=[{"role":"user", "content":"Reply: ok"}], temperature=1.0, max_tokens=8, num_retries=0)
          print("provider preflight ok", r.model)
          PY
      - name: Run current central Mini-SWE on DeepSWE task
        run: |
          set -uo pipefail
          mkdir -p results/deepswe
          pier run -p deepswe-bench/tasks --include-task-name "$TASK" \
            --agent-import-path eval.gt_central_agent:MiniSweCentralAgent \
            -m "$MODEL" -o results/deepswe \
            --job-name "deepswe-central-${GITHUB_RUN_ID}-${TASK}" \
            --agent-timeout-multiplier 1.0 -n 1 -y \
            --ak integration_mode=active \
            --ak policy_mode=certified_active \
            --ak preflight_mode=shadow \
            --ak enable_all_features=true \
            --ak enable_submit_readiness=true \
            --ak enable_repository_intelligence=true \
            --ak require_graph_ready=true \
            --ak repository_initial_index_timeout_sec=60 \
            --ak enable_lint=true \
            --ak enable_feature_guidance=true \
            --ak enable_context_frontier=true \
            --ak enable_preemptive_retrieval=true \
            --ak preemptive_retrieval_model_dir="$MODEL_DIR" \
            --ak enable_context_compaction=false \
            --ak enable_completion_controller=false \
            --ak enable_progress_control=false \
            --ak enable_adaptive_validation_timeout=false \
            --ak enable_replay_capture=false \
            --ak enable_task_start_advisory=false \
            --ak step_limit="$STEP_LIMIT" \
            --ak execution_budget_sec=5400 \
            2>&1 | tee deepswe-task.log
      - name: Upload task evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepswe-central-${{ github.run_id }}-${{ matrix.task }}
          path: |
            results/deepswe/
            dense-backend-proof.json
            deepswe-budget-${{ matrix.task }}.json
            deepswe-task.log
          if-no-files-found: warn

  merge:
    needs: [plan, run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download task evidence
        uses: actions/download-artifact@v4
        with:
          pattern: deepswe-central-${{ github.run_id }}-*
          path: tasks
          merge-multiple: false
      - name: Merge receipts, outcomes, and delivery metrics
        env:
          EXPECTED: ${{ needs.plan.outputs.tasks }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from gt_engine.delivery_audit import audit_provider_deliveries

          expected = json.loads(os.environ.get("EXPECTED") or "[]")
          rows, missing = [], []
          for task in expected:
              root = Path("tasks") / f"deepswe-central-{os.environ['RUN_ID']}-{task}"
              receipts = list(root.rglob("central_receipt.json"))
              results = list(root.rglob("result.json"))
              if not receipts or not results:
                  missing.append(task); continue
              receipt = json.loads(receipts[0].read_text(encoding="utf-8"))
              parsed_results = [json.loads(p.read_text(encoding="utf-8")) for p in results]
              # Harbor writes an aggregate result.json beside the trial
              # directory.  Outcome fields live in the nested trial result;
              # selecting the aggregate yields a None verifier_result.
              result = next(
                  (item for item in parsed_results if isinstance(item, dict) and
                   ("verifier_result" in item or "exception_info" in item)),
                  parsed_results[-1],
              )
              metrics = receipt.get("metrics") or {}
              intel = receipt.get("repository_intelligence") or {}
              _, failures, totals = audit_provider_deliveries(receipt, task=task)
              rewards = (result.get("verifier_result") or {}).get("rewards") or {}
              solved = bool(rewards) and all(isinstance(v, (int, float)) and v >= 1 for v in rewards.values())
              rows.append({"task": task, "solved": solved, "rewards": rewards,
                           "exception": result.get("exception_info"),
                           "graph_status": intel.get("status"),
                           "graph_applicability": intel.get("applicability"),
                           "graph_failures": intel.get("failures") or [],
                           "dense_available": bool((receipt.get("preemptive_retrieval") or {}).get("dense_backend", {}).get("available")),
                           "provider_delivery_count": totals.get("delivery_count"),
                           "provider_delivery_chars": totals.get("visible_chars"),
                           "delivery_failures": failures,
                           "provider_calls": metrics.get("api_calls"),
                           "assistant_steps": metrics.get("assistant_steps"),
                           "effective_actions": metrics.get("effective_task_actions"),
                           "actions": metrics.get("actions"),
                           "total_tokens": metrics.get("total_tokens"),
                           "total_gt_context_chars": metrics.get("total_gt_context_chars_added"),
                           "wall_time_sec": metrics.get("wall_time_sec")})
          out = {"schema": "gt.deepswe.central.smoke.v1.1", "tasks": expected, "rows": rows, "missing": missing,
                 "solved": sum(r["solved"] for r in rows), "planned": len(expected)}
          Path("DEEPSWE_SMOKE_RESULTS.json").write_text(json.dumps(out, indent=2) + "\n", encoding="utf-8")
          md = ["# DeepSWE central ten-task smoke", "", f"- solved: **{out['solved']}/{out['planned']}**", f"- missing artifacts: **{len(missing)}**", "", "| task | solved | deliveries | graph | dense | calls | steps | actions | tokens |", "|---|---:|---:|---|---:|---:|---:|---:|---:|"]
          for r in rows:
              md.append(f"| {r['task']} | {int(r['solved'])} | {r['provider_delivery_count']} | {r['graph_status']} | {int(r['dense_available'])} | {r['provider_calls']} | {r['assistant_steps']} | {r['effective_actions']} | {r['total_tokens']} |")
          Path("DEEPSWE_SMOKE_RESULTS.md").write_text("\n".join(md) + "\n", encoding="utf-8")
          print("\n".join(md))
          if missing:
              raise SystemExit("missing task artifacts: " + ", ".join(missing))
          if any(r["delivery_failures"] for r in rows):
              raise SystemExit("provider-delivery audit failed")
          PY
      - name: Publish merged smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepswe-central-${{ github.run_id }}-merged
          path: |
            DEEPSWE_SMOKE_RESULTS.json
            DEEPSWE_SMOKE_RESULTS.md
          if-no-files-found: warn
