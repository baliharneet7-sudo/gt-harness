# DeepSWE v1.1 catalog-compatible bounded evaluation for the current
# host-owned central runtime.  The upstream repository has no v1.1 tag; this
# workflow pins the immutable main snapshot whose 113 task IDs match the
# published v1.1 catalog.
# The v1.1 task contract is executed by the pinned Pier runner.  Pier is the
# Harbor-compatible orchestrator that creates the separate verifier environment,
# runs verifier.collect hooks (including the commit-to-patch collector), and
# grades the pristine verifier checkout.  Mini-SWE still runs through the
# host-owned eval.gt_central_agent:MiniSweCentralAgent import.
name: DeepSWE Mini-SWE central evaluation

on:
  workflow_dispatch:
    inputs:
      model:
        description: "DeepSeek V4 Flash model id passed to litellm"
        type: string
        required: true
        default: "deepseek-v4-flash-0731"
      parallel:
        description: "Maximum concurrent DeepSWE tasks"
        type: string
        required: true
        default: "20"
      task_ids:
        description: "Optional comma-separated DeepSWE v1.1 catalog task IDs; empty selects two per language"
        type: string
        required: false
        default: ""
      task_count:
        description: "Expected task count (10 diagnostic; 20 promotion cohort; up to 113)"
        type: string
        required: true
        default: "10"
      step_limit:
        description: "Mini-SWE model-call limit per task (DeepSWE parity is 300)"
        type: string
        required: true
        default: "300"
      ref:
        description: "Current GT commit/ref to evaluate"
        type: string
        required: true
        default: "baseline-swe-live-lite-v4flash0731"
      provider:
        description: "Frozen provider route for this final comparison"
        type: choice
        required: true
        options: [openrouter]
        default: "openrouter"
      baseline_run_id:
        description: "GitHub run ID containing the frozen contemporaneous GT-off result"
        type: string
        required: true
      baseline_artifact_name:
        description: "Exact merged GT-off artifact name from baseline_run_id"
        type: string
        required: true
      release_phase:
        description: "Outcome gate: preserve first, then require a net positive flip"
        type: choice
        required: true
        options: [preservation, promotion]
        default: preservation
      diagnostic_only:
        description: "Run a treatment-only diagnostic; compare offline to a prior run and skip the frozen GT-off release gate"
        type: boolean
        required: false
        default: false
      comparison_profile:
        description: "Controller profile for a fair comparison with the prior central run"
        type: choice
        required: true
        options: [persistent_state_only, certified_full]
        default: persistent_state_only

permissions:
  contents: read
  packages: read
  actions: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"
  GT_REQUIRE_FULL_POTENTIAL: "1"
  GT_REQUIRE_FTS5: "1"
  GT_FORCE_ONNX_EMBEDDER: "1"
  GT_REQUIRE_EMBEDDER: "1"
  GT_REQUIRE_COMMIT_PARITY: "1"
  GT_RRF_FUSION: "on"
  GT_LOC_FUSION_V2: "1"
  GT_LOC_BEHAVIOR_LEAD: "0"
  SNOWFLAKE_MODEL_REVISION: 7802add0519e4bf94c46ef23552176697c7a1ac7
  SNOWFLAKE_MODEL_SHA256: 564e6c65ee0c739a486702e9e3e9b33c3f697c19c34dbe886bce9eec497ce971
  SNOWFLAKE_TOKENIZER_SHA256: 91f1def9b9391fdabe028cd3f3fcc4efd34e5d1f08c3bf2de513ebb5911a1854
  GT_DENSE_INTRA_OP_THREADS: "4"
  GT_DENSE_INTER_OP_THREADS: "1"
  GT_OPENROUTER_PROVIDER_ONLY: deepseek
  GT_OPENROUTER_DATA_COLLECTION: allow

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tasks: ${{ steps.select.outputs.tasks }}
      bench_sha: ${{ steps.bench.outputs.sha }}
      gt_sha: ${{ steps.gt.outputs.sha }}
    env:
      TASK_IDS: ${{ inputs.task_ids }}
      TASK_COUNT: ${{ inputs.task_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Resolve exact GT revision
        id: gt
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned DeepSWE task set
        uses: actions/checkout@v4
        with:
          repository: datacurve-ai/deep-swe
          ref: 435ee89ec2f2e2289f33b0da4f992f0b7b7266b9
          path: deepswe-bench
      - name: Prove DeepSWE v1.1 catalog-compatible provenance
        id: bench
        working-directory: deepswe-bench
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          test "$sha" = "435ee89ec2f2e2289f33b0da4f992f0b7b7266b9" || {
            echo "::error::unexpected DeepSWE v1.1 catalog snapshot: $sha"; exit 1;
          }
          test "$(find tasks -mindepth 2 -maxdepth 2 -name task.toml | wc -l)" -eq 113 || {
            echo "::error::DeepSWE v1.1 catalog snapshot must contain 113 tasks"; exit 1;
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Select balanced DeepSWE tasks
        id: select
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, tomllib
          from pathlib import Path

          root = Path("deepswe-bench/tasks")
          target = int(os.environ["TASK_COUNT"])
          if not 1 <= target <= 113:
              raise SystemExit(f"TASK_COUNT must be between 1 and 113, got {target}")
          explicit = [x.strip() for x in os.environ.get("TASK_IDS", "").split(",") if x.strip()]
          rows = []
          for p in sorted(root.iterdir()):
              cfg = p / "task.toml"
              if not p.is_dir() or not cfg.is_file():
                  continue
              with cfg.open("rb") as fh:
                  data = tomllib.load(fh)
              rows.append((p.name, str((data.get("metadata") or {}).get("language") or "unknown")))
          names = {name for name, _ in rows}
          if explicit:
              missing = sorted(set(explicit) - names)
              if missing or len(explicit) != target:
                  raise SystemExit(
                      f"explicit DeepSWE cohort requires exactly {target} valid IDs; missing={missing}"
                  )
              selected = explicit
          else:
              by_lang = {}
              for name, lang in rows:
                  by_lang.setdefault(lang, []).append(name)
              langs = [lang for lang in ("go", "python", "typescript", "javascript", "rust") if lang in by_lang]
              if len(langs) != 5:
                  raise SystemExit(f"expected five DeepSWE language families, got {sorted(by_lang)}")
              selected = []
              for index in range(max(len(by_lang[lang]) for lang in langs)):
                  for lang in langs:
                      if index < len(by_lang[lang]):
                          selected.append(by_lang[lang][index])
                          if len(selected) == target:
                              break
                  if len(selected) == target:
                      break
              if len(selected) != target:
                  raise SystemExit(f"balanced selection produced {len(selected)} tasks")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("tasks=" + json.dumps(selected, separators=(",", ":")) + "\n")
          summary = "## DeepSWE evaluation task set\n\n" + "\n".join(f"- `{x}`" for x in selected)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(summary + "\n")
          print(summary)

  baseline:
    if: ${{ !inputs.diagnostic_only }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download frozen GT-off comparison before any paid task
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          BASELINE_ARTIFACT_NAME: ${{ inputs.baseline_artifact_name }}
        run: |
          set -euo pipefail
          test -n "$BASELINE_RUN_ID" && test -n "$BASELINE_ARTIFACT_NAME"
          mkdir -p baseline-evidence
          gh run download "$BASELINE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$BASELINE_ARTIFACT_NAME" \
            --dir baseline-evidence
          mapfile -t candidates < <(find baseline-evidence -name DEEPSWE_EVALUATION_RESULTS.json -type f)
          test "${#candidates[@]}" -eq 1 || {
            echo "::error::expected one frozen baseline evaluation, found ${#candidates[@]}"; exit 1;
          }
          cp "${candidates[0]}" DEEPSWE_BASELINE_RESULTS.json
      - name: Prove comparison manifest and task parity
        env:
          EXPECTED: ${{ needs.plan.outputs.tasks }}
          BENCH_SHA: ${{ needs.plan.outputs.bench_sha }}
          MODEL: ${{ inputs.model }}
          STEP_LIMIT: ${{ inputs.step_limit }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path("DEEPSWE_BASELINE_RESULTS.json").read_text(encoding="utf-8"))
          if payload.get("schema") != "gt.deepswe.central.evaluation.v1.1":
              raise SystemExit("baseline schema is not the frozen evaluation contract")
          expected = json.loads(os.environ["EXPECTED"])
          rows = payload.get("rows") or []
          if [row.get("task") for row in rows] != expected:
              raise SystemExit("baseline task order/set does not match treatment plan")
          manifest = payload.get("manifest") or {}
          expected_model = os.environ["MODEL"]
          if expected_model in {"deepseek-v4-flash", "deepseek-v4-flash-0731"}:
              expected_model = "deepseek/deepseek-v4-flash-0731"
          required = {
              "benchmark_sha": os.environ["BENCH_SHA"],
              "model": expected_model,
              "provider": "openrouter:deepseek:only:no-fallback",
              "temperature": 1.0,
              "step_limit": int(os.environ["STEP_LIMIT"]),
              "execution_budget_sec": 5400,
              "runner": "datacurve-pier==0.3.1",
          }
          mismatches = {
              key: {"expected": value, "observed": manifest.get(key)}
              for key, value in required.items()
              if manifest.get(key) != value
          }
          if mismatches:
              raise SystemExit("baseline manifest mismatch: " + json.dumps(mismatches, sort_keys=True))
          required_metrics = {"total_tokens", "provider_calls", "decision_actions", "provider_cost_usd"}
          for row in rows:
              missing = sorted(required_metrics - set(row))
              if missing:
                  raise SystemExit(f"baseline row {row.get('task')} missing metrics: {missing}")
          print("BASELINE_APPROVED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: deepswe-baseline-approved-${{ github.run_id }}
          path: DEEPSWE_BASELINE_RESULTS.json
          if-no-files-found: error

  run:
    needs: [plan, baseline]
    if: ${{ always() && (inputs.diagnostic_only || needs.baseline.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix:
        task: ${{ fromJson(needs.plan.outputs.tasks) }}
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODEL: ${{ inputs.model }}
      TASK: ${{ matrix.task }}
      STEP_LIMIT: ${{ inputs.step_limit }}
      PROVIDER: ${{ inputs.provider }}
      PROFILE: ${{ inputs.comparison_profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Bind receipts to the exact checked-out GT revision
        run: echo "GT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Checkout pinned DeepSWE task set
        uses: actions/checkout@v4
        with:
          repository: datacurve-ai/deep-swe
          ref: 435ee89ec2f2e2289f33b0da4f992f0b7b7266b9
          path: deepswe-bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/gt-index-src/go.mod
          cache-dependency-path: vendor/gt-index-src/go.sum
      - name: Build current GT index with FTS5
        working-directory: vendor/gt-index-src
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          go build -tags sqlite_fts5 -o "$RUNNER_TEMP/gt-index" ./cmd/gt-index/
          chmod +x "$RUNNER_TEMP/gt-index"
          echo "GT_INDEX_BINARY=$RUNNER_TEMP/gt-index" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/gt-index" -h >/dev/null 2>&1 || true
      - name: Install current central runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[retrieval]' "mini-swe-agent==2.2.8" "harbor==0.20.0" "datacurve-pier==0.3.1" pytest pytest-asyncio \
            vendor/groundtruth_mcp-*.whl
          test "$(python -c 'import importlib.metadata as m; print(m.version("datacurve-pier"))')" = "0.3.1"
      - name: Provision and verify pinned Snowflake ONNX backend
        run: |
          set -euo pipefail
          model_dir="$RUNNER_TEMP/snowflake-arctic-embed-m"
          mkdir -p "$model_dir"
          gh release download gt-retrieval-runtime-v1 --repo harneet2512/gt-harness \
            --pattern model.onnx --pattern tokenizer.json --pattern manifest.json --dir "$model_dir"
          echo "$SNOWFLAKE_MODEL_SHA256  $model_dir/model.onnx" | sha256sum -c -
          echo "$SNOWFLAKE_TOKENIZER_SHA256  $model_dir/tokenizer.json" | sha256sum -c -
          MODEL_DIR="$model_dir" python - <<'PY'
          import json, os
          from pathlib import Path
          from gt_engine.snowflake_onnx import SnowflakeOnnxDenseBackend
          root = Path(os.environ["MODEL_DIR"])
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest.get("model") == "Snowflake/snowflake-arctic-embed-m"
          assert manifest.get("revision") == os.environ["SNOWFLAKE_MODEL_REVISION"]
          assert manifest.get("inference_api") is False
          backend = SnowflakeOnnxDenseBackend.from_directory(root)
          q, d = backend.embed_query("repository implementation"), backend.embed_documents(("def implementation(): pass",))[0]
          assert q and d and not (backend.receipt().get("network_calls") or backend.receipt().get("provider_calls"))
          Path("dense-backend-proof.json").write_text(json.dumps({"identity": backend.identity, "available": True, "receipt": backend.receipt()}, indent=2) + "\n", encoding="utf-8")
          print(backend.identity)
          PY
          echo "MODEL_DIR=$model_dir" >> "$GITHUB_ENV"
      - name: Prove current provider-free runtime before task execution
        run: |
          set -euo pipefail
          # GITHUB_ENV is available to later steps, but make the exact
          # source-built binary explicit for every subprocess in this proof
          # step.  The strict pytest child must not fall back to the stale
          # wheel/cache binary.
          export GT_INDEX_BINARY="$RUNNER_TEMP/gt-index"
          test -x "$GT_INDEX_BINARY"
          python scripts/verify_gt_index_runtime.py
          python scripts/central_readiness_audit.py
          python scripts/central_pre_smoke_gate.py
      - name: Sanitize provider credentials
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys
          names = ("OPENROUTER_API_KEY", "OPENAI_API_KEY", "ANTHROPIC_API_KEY")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              for name in names:
                  raw = os.environ.get(name) or ""
                  if not raw:
                      continue
                  clean = raw.replace("\ufeff", "").strip()
                  if not clean.isascii():
                      raise SystemExit(f"{name} contains non-ASCII header data")
                  print(f"::add-mask::{clean}")
                  out.write(f"{name}={clean}\n")
          PY
          if [ "${PROVIDER:-configured}" = "openrouter" ]; then
            # Force Mini-SWE's actual model builder onto OpenRouter.  Merely
            # supplying OPENROUTER_API_KEY is insufficient: a model string
            # containing `deepseek/` otherwise selects LiteLLM's native
            # DeepSeek provider and bypasses OpenRouter.
            echo "OPENAI_BASE_URL=https://openrouter.ai/api/v1" >> "$GITHUB_ENV"
            echo "OPENAI_API_KEY=${OPENROUTER_API_KEY}" >> "$GITHUB_ENV"
          fi
      - name: Resolve exact DeepSWE task budget
        run: |
          set -euo pipefail
          python scripts/resolve_harbor_budget.py \
            --task-config "deepswe-bench/tasks/$TASK/task.toml" \
            --multiplier 1.0 --output "deepswe-budget-$TASK.json"
      - name: Provider preflight
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}${OPENAI_API_KEY:-}${ANTHROPIC_API_KEY:-}" || {
            echo "::error::no provider credential configured"; exit 1;
          }
          MODEL="$MODEL" python - <<'PY'
          import json, os, litellm
          from pathlib import Path
          m = os.environ["MODEL"]
          base = (os.environ.get("OPENAI_BASE_URL") or "").strip()
          kwargs = {"temperature": 1.0, "max_tokens": 8, "num_retries": 0}
          if os.environ.get("PROVIDER") == "openrouter":
              if m in {"deepseek-v4-flash", "deepseek-v4-flash-0731"}:
                  m = "deepseek/deepseek-v4-flash-0731"
              if not m.startswith("openai/"):
                  m = f"openai/{m}"
              kwargs["api_key"] = os.environ["OPENROUTER_API_KEY"]
              kwargs["api_base"] = base or "https://openrouter.ai/api/v1"
              kwargs["extra_body"] = {
                  "provider": {
                      "only": ["deepseek"],
                      "order": ["deepseek"],
                      "allow_fallbacks": False,
                      "require_parameters": True,
                      "data_collection": "allow",
                  }
              }
          elif base:
              # Mirror MiniSweCentralAgent._build_model: the gateway receives
              # the bare DeepSeek model id through an OpenAI provider route.
              if "/" not in m:
                  m = f"openai/{m}"
              kwargs["api_base"] = base
          r = litellm.completion(model=m, messages=[{"role":"user", "content":"Reply: ok"}], **kwargs)
          response = r.model_dump()
          proof = {
              "schema": "gt.provider_route_proof.v1",
              "requested_model": m,
              "response_model": str(response.get("model") or ""),
              "requested_provider": (
                  "deepseek" if os.environ.get("PROVIDER") == "openrouter" else "configured"
              ),
              "response_provider": str(response.get("provider") or ""),
              "allow_fallbacks": False if os.environ.get("PROVIDER") == "openrouter" else None,
              "require_parameters": True if os.environ.get("PROVIDER") == "openrouter" else None,
              "data_collection": "allow" if os.environ.get("PROVIDER") == "openrouter" else None,
          }
          Path("provider-route-proof.json").write_text(
              json.dumps(proof, indent=2) + "\n", encoding="utf-8"
          )
          print("provider preflight ok", r.model)
          PY
      - name: Run current central Mini-SWE on DeepSWE task
        run: |
          set -uo pipefail
          mkdir -p results/deepswe
          run_task() {
            PROFILE_ARGS=()
            if [ "$PROFILE" = "persistent_state_only" ]; then
              # Match the preceding central comparison exactly, adding only
              # the graph-first persistent execution state mechanism.
              PROFILE_ARGS=(
                --ak integration_mode=active --ak policy_mode=certified_active
                --ak preflight_mode=shadow
                --ak enable_all_features=true --ak enable_submit_readiness=true
                --ak enable_repository_intelligence=true --ak require_graph_ready=true
                --ak repository_initial_index_timeout_sec=60
                --ak repository_refresh_timeout_sec=60
                --ak enable_lint=true --ak enable_feature_guidance=true
                --ak enable_context_frontier=true --ak enable_preemptive_retrieval=true
                --ak enable_persistent_execution_state=true
                --ak persistent_state_bootstrap_timeout_sec=45
                --ak persistent_state_bootstrap_input_tokens=2000
                --ak persistent_state_bootstrap_output_tokens=512
                --ak persistent_state_context_tokens=512
                --ak preemptive_retrieval_model_dir="$MODEL_DIR"
                --ak enable_context_compaction=false
                --ak enable_completion_controller=false
                --ak enable_progress_control=false
                --ak enable_adaptive_validation_timeout=false
              )
            elif [ "$PROFILE" = "certified_full" ]; then
              PROFILE_ARGS=(
                --ak integration_mode=active --ak policy_mode=certified_active
                --ak preflight_mode=assistive_safe
                --ak enable_all_features=true --ak enable_submit_readiness=true
                --ak enable_repository_intelligence=true --ak require_graph_ready=true
                --ak repository_initial_index_timeout_sec=60
                --ak repository_refresh_timeout_sec=60
                --ak enable_lint=true --ak enable_feature_guidance=true
                --ak enable_context_frontier=true --ak enable_preemptive_retrieval=true
                --ak enable_persistent_execution_state=true
                --ak persistent_state_bootstrap_timeout_sec=45
                --ak persistent_state_bootstrap_input_tokens=2000
                --ak persistent_state_bootstrap_output_tokens=512
                --ak persistent_state_context_tokens=512
                --ak preemptive_retrieval_model_dir="$MODEL_DIR"
                --ak enable_context_compaction=true
                --ak enable_completion_controller=true
                --ak enable_progress_control=true
                --ak enable_adaptive_validation_timeout=true
              )
            else
              echo "::error::unknown comparison profile: $PROFILE"
              return 2
            fi
            timeout --signal=TERM --kill-after=30s 6000s pier run -p deepswe-bench/tasks --include-task-name "$TASK" \
              --agent-import-path eval.pier_gt_adapter:PierMiniSweCentralAgent \
              -m "$MODEL" -o results/deepswe \
              --job-name "deepswe-central-${GITHUB_RUN_ID}-${TASK}" \
              --agent-timeout-multiplier 1.0 -n 1 -y \
              "${PROFILE_ARGS[@]}" \
              --ak enable_decision_sufficiency=true \
              --ak enable_replay_capture=false \
              --ak enable_task_start_advisory=false \
              --ak step_limit="$STEP_LIMIT" \
              --ak execution_budget_sec=5400
          }
          set +e
          run_task 2>&1 | tee deepswe-task.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] \
            && ! find results/deepswe -name central_receipt.json -print -quit | grep -q . \
            && ! find results/deepswe -name provider_query_started.json -print -quit | grep -q .; then
            echo "infra-only retry: no GT provider query started"
            mkdir -p results/deepswe-infra-attempt-1
            find results/deepswe -mindepth 1 -maxdepth 1 -exec mv -t results/deepswe-infra-attempt-1 -- {} +
            set +e
            run_task 2>&1 | tee -a deepswe-task.log
            status=${PIPESTATUS[0]}
            set -e
          fi
          exit "$status"
      - name: Upload task evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepswe-central-${{ github.run_id }}-${{ matrix.task }}
          path: |
            results/deepswe/
            results/deepswe-infra-attempt-1/
            dense-backend-proof.json
            provider-route-proof.json
            deepswe-budget-${{ matrix.task }}.json
            deepswe-task.log
          if-no-files-found: warn

  merge:
    needs: [plan, baseline, run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install current audit runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[retrieval]' pytest
      - name: Download task evidence
        uses: actions/download-artifact@v4
        with:
          pattern: deepswe-central-${{ github.run_id }}-*
          path: tasks
          merge-multiple: false
      - name: Download approved frozen baseline
        if: ${{ !inputs.diagnostic_only }}
        uses: actions/download-artifact@v4
        with:
          name: deepswe-baseline-approved-${{ github.run_id }}
          path: baseline-approved
      - name: Stage approved baseline
        if: ${{ !inputs.diagnostic_only }}
        run: cp baseline-approved/DEEPSWE_BASELINE_RESULTS.json DEEPSWE_BASELINE_RESULTS.json
      - name: Merge receipts, outcomes, and delivery metrics
        env:
          EXPECTED: ${{ needs.plan.outputs.tasks }}
          RUN_ID: ${{ github.run_id }}
          BENCH_SHA: ${{ needs.plan.outputs.bench_sha }}
          GT_SHA: ${{ needs.plan.outputs.gt_sha }}
          MODEL: ${{ inputs.model }}
          PROVIDER: ${{ inputs.provider }}
          STEP_LIMIT: ${{ inputs.step_limit }}
          PROFILE: ${{ inputs.comparison_profile }}
          DIAGNOSTIC_ONLY: ${{ inputs.diagnostic_only && '1' || '0' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from gt_engine.delivery_audit import audit_provider_deliveries
          from gt_engine.runtime_gate import audit_runtime_receipt
          from scripts.central_release_gate import audit_treatment_runtime

          expected = json.loads(os.environ.get("EXPECTED") or "[]")
          rows, missing = [], []
          for task in expected:
              root = Path("tasks") / f"deepswe-central-{os.environ['RUN_ID']}-{task}"
              receipts = list(root.rglob("central_receipt.json"))
              results = list(root.rglob("result.json"))
              provider_proofs = list(root.rglob("provider-route-proof.json"))
              if not receipts or not results or len(provider_proofs) != 1:
                  missing.append(task); continue
              receipt = json.loads(receipts[0].read_text(encoding="utf-8"))
              parsed_results = [json.loads(p.read_text(encoding="utf-8")) for p in results]
              # Harbor writes an aggregate result.json beside the trial
              # directory.  Outcome fields live in the nested trial result;
              # selecting the aggregate yields a None verifier_result.
              result = next(
                  (item for item in parsed_results if isinstance(item, dict) and
                   ("verifier_result" in item or "exception_info" in item)),
                  parsed_results[-1],
              )
              metrics = receipt.get("metrics") or {}
              intel = receipt.get("repository_intelligence") or {}
              _, failures, totals = audit_provider_deliveries(receipt, task=task)
              runtime_failures, runtime_gate = audit_runtime_receipt(receipt, task=task)
              treatment_checks = audit_treatment_runtime(receipt, label=task)
              treatment_failures = [
                  failure
                  for check in treatment_checks
                  for failure in check.failures
              ]
              rewards = (result.get("verifier_result") or {}).get("rewards") or {}
              exception = result.get("exception_info")
              solved = rewards.get("reward") == 1 and not exception
              preemptive = receipt.get("preemptive_retrieval") or {}
              dense_backend = preemptive.get("dense_backend") or {}
              provider_proof = json.loads(
                  provider_proofs[0].read_text(encoding="utf-8")
              )
              provider_route_valid = bool(
                  provider_proof.get("requested_model")
                  == "openai/deepseek/deepseek-v4-flash-0731"
                  and provider_proof.get("requested_provider") == "deepseek"
                  and provider_proof.get("allow_fallbacks") is False
                  and provider_proof.get("require_parameters") is True
                  and (receipt.get("provider_route") or {}).get("model")
                  == "openai/deepseek/deepseek-v4-flash-0731"
                  and (receipt.get("provider_route") or {}).get("api_base")
                  == "https://openrouter.ai/api/v1"
                  and ((receipt.get("provider_route") or {}).get("provider_policy") or {}).get("only")
                  == ["deepseek"]
                  and (receipt.get("provider_route") or {}).get("credential_in_receipt")
                  is False
              )
              rows.append({"task": task, "solved": solved, "rewards": rewards,
                           "exception": exception,
                           "graph_status": intel.get("status"),
                           "graph_applicability": intel.get("applicability"),
                           "graph_failures": intel.get("failures") or [],
                           "dense_available": bool(dense_backend.get("available")),
                           "provider_route_valid": provider_route_valid,
                           "provider_route_proof": provider_proof,
                           "provider_delivery_count": totals.get("delivery_count"),
                           "provider_delivery_chars": totals.get("visible_chars"),
                           "delivery_failures": failures,
                           "runtime_gate_failures": runtime_failures,
                           "runtime_gate": runtime_gate,
                           "treatment_release_failures": treatment_failures,
                           "provider_calls": metrics.get("api_calls"),
                           "assistant_steps": metrics.get("assistant_steps"),
                           "decision_actions": metrics.get("decision_actions"),
                           "effective_actions": metrics.get("effective_task_actions"),
                           "actions": metrics.get("actions"),
                           "total_tokens": metrics.get("total_tokens"),
                           "provider_cost_usd": metrics.get("provider_cost_usd"),
                           "total_gt_context_chars": metrics.get("total_gt_context_chars_added"),
                           "persistent_state_enabled": metrics.get("persistent_state_enabled"),
                           "persistent_state_initialized": metrics.get("persistent_state_initialized"),
                           "persistent_state_initial_retrieval_calls": metrics.get("persistent_state_initial_retrieval_calls"),
                           "persistent_state_initial_retrieval_latency_ms": metrics.get("persistent_state_initial_retrieval_latency_ms"),
                           "persistent_state_bootstrap_calls": metrics.get("persistent_state_bootstrap_calls"),
                           "persistent_state_bootstrap_input_tokens": metrics.get("persistent_state_bootstrap_input_tokens"),
                           "persistent_state_bootstrap_output_tokens": metrics.get("persistent_state_bootstrap_output_tokens"),
                           "persistent_state_bootstrap_latency_ms": metrics.get("persistent_state_bootstrap_latency_ms"),
                           "persistent_state_context_compilations": metrics.get("persistent_state_context_compilations"),
                           "persistent_state_preflight_projections": metrics.get("persistent_state_preflight_projections"),
                           "persistent_state_postflight_commits": metrics.get("persistent_state_postflight_commits"),
                           "persistent_state_graph_rebases": metrics.get("persistent_state_graph_rebases"),
                           "persistent_state_material_transitions": metrics.get("persistent_state_material_transitions"),
                           "persistent_state_deliveries": metrics.get("persistent_state_deliveries"),
                           "wall_time_sec": metrics.get("wall_time_sec")})
          provider_identity = (
              "openrouter:deepseek:only:no-fallback"
              if os.environ.get("PROVIDER") == "openrouter"
              else "configured"
          )
          model_identity = os.environ.get("MODEL") or ""
          if provider_identity.startswith("openrouter") and model_identity in {"deepseek-v4-flash", "deepseek-v4-flash-0731"}:
              model_identity = "deepseek/deepseek-v4-flash-0731"
          out = {"schema": "gt.deepswe.central.evaluation.v1.1",
                 "manifest": {"benchmark_sha": os.environ.get("BENCH_SHA"),
                              "gt_commit": os.environ.get("GT_SHA"),
                              "model": model_identity,
                              "provider": provider_identity,
                              "temperature": 1.0,
                              "step_limit": int(os.environ.get("STEP_LIMIT") or 0),
                              "execution_budget_sec": 5400,
                              "runner": "datacurve-pier==0.3.1",
                              "comparison_profile": os.environ.get("PROFILE") or "",
                              "diagnostic_only": os.environ.get("DIAGNOSTIC_ONLY") == "1"},
                 "tasks": expected, "rows": rows, "missing": missing,
                 "solved": sum(r["solved"] for r in rows), "planned": len(expected)}
          Path("DEEPSWE_EVALUATION_RESULTS.json").write_text(json.dumps(out, indent=2) + "\n", encoding="utf-8")
          md = ["# DeepSWE central evaluation", "", f"- solved: **{out['solved']}/{out['planned']}**", f"- profile: **{out['manifest']['comparison_profile']}**", f"- diagnostic-only: **{out['manifest']['diagnostic_only']}**", f"- missing artifacts: **{len(missing)}**", "", "| task | solved | deliveries | graph | dense | calls | steps | actions | tokens | bootstrap calls | state frames |", "|---|---:|---:|---|---:|---:|---:|---:|---:|---:|---:|"]
          for r in rows:
              md.append(f"| {r['task']} | {int(r['solved'])} | {r['provider_delivery_count']} | {r['graph_status']} | {int(r['dense_available'])} | {r['provider_calls']} | {r['assistant_steps']} | {r['effective_actions']} | {r['total_tokens']} | {r['persistent_state_bootstrap_calls']} | {r['persistent_state_context_compilations']} |")
          Path("DEEPSWE_EVALUATION_RESULTS.md").write_text("\n".join(md) + "\n", encoding="utf-8")
          print("\n".join(md))
          if missing:
              raise SystemExit("missing task artifacts: " + ", ".join(missing))
          if any(r["delivery_failures"] for r in rows):
              raise SystemExit("provider-delivery audit failed")
          if any(r["runtime_gate_failures"] for r in rows):
              raise SystemExit("GT runtime integrity gate failed")
          if any(r["treatment_release_failures"] for r in rows):
              raise SystemExit("GT treatment release gate failed")
          if any(not r["provider_route_valid"] for r in rows):
              raise SystemExit("exact provider route gate failed")
          PY
      - name: Enforce outcome-first DeepSWE release gate
        if: ${{ !inputs.diagnostic_only }}
        run: |
          set -euo pipefail
          python scripts/deepswe_release_gate.py \
            --baseline DEEPSWE_BASELINE_RESULTS.json \
            --treatment DEEPSWE_EVALUATION_RESULTS.json \
            --phase "${{ inputs.release_phase }}" \
            --output DEEPSWE_RELEASE_GATE.json
      - name: Publish merged evaluation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepswe-central-${{ github.run_id }}-merged
          path: |
            DEEPSWE_EVALUATION_RESULTS.json
            DEEPSWE_EVALUATION_RESULTS.md
            DEEPSWE_BASELINE_RESULTS.json
            DEEPSWE_RELEASE_GATE.json
          if-no-files-found: warn
