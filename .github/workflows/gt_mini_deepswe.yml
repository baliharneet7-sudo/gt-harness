# GT-on mini run: DeepSWE, 20 fixed tasks, 5 at a time.
#
# Stage first5 runs the first five tasks. Stage rest15 runs the other fifteen
# and refuses to start unless first5_run_id names a SUCCESSFUL first5 run of
# this same workflow in this repository - "only if those 5 go". Parallelism is
# 5 so the run fits beside other work on the account's runner pool. The
# certified pipeline does the work; this file owns the task set and the gate.
# GT-on only: there is no GT-off arm here or in the called pipeline.
name: "GT mini DeepSWE (20 tasks, 5 parallel)"
run-name: "GT mini DeepSWE | ${{ inputs.stage }} | ${{ inputs.model }} | ${{ inputs.gt_delivery_mode }}"

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "first5, then rest15 once first5 succeeded"
        required: true
        type: choice
        options: [first5, rest15]
        default: first5
      first5_run_id:
        description: "rest15 only: the successful first5 run of this workflow"
        required: false
        type: string
        default: ""
      model:
        description: "OpenRouter model id chosen at launch (bare id, e.g. stealth/space-bunny-alpha)"
        required: true
        type: string
      gt_delivery_mode:
        description: "GT delivery (both are GT-on)"
        required: true
        type: choice
        options: [attached, push, thin]
        default: attached
      thin_tasks:
        description: 'thin only: JSON list of tasks, or "all" (thin = baseline harness + GT observations)'
        required: false
        type: string
        default: '["true-myth-iterable-collection-combinators","kysely-window-grouping-helpers","fastapi-deprecation-response-headers","testem-bail-on-test-failure","superjson-error-stack-serialization"]'
      reasoning_effort:
        description: "minimal|low|medium|high|xhigh|max; empty = not sent"
        required: false
        type: string
        default: ""
      step_limit:
        description: "Agent step limit"
        required: false
        type: string
        default: "300"
      approve_paid_run:
        description: "Explicit approval for provider requests (required even at $0)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tasks: ${{ steps.tasks.outputs.tasks }}
    steps:
      - name: Resolve the stage's tasks and enforce the first5 gate
        id: tasks
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ inputs.stage }}
          FIRST5_RUN_ID: ${{ inputs.first5_run_id }}
          WORKFLOW_PATH: .github/workflows/gt_mini_deepswe.yml
        run: |
          set -euo pipefail
          FIRST5="abs-module-cache-flags,adaptix-name-mapping-aliases,csstree-shorthand-expansion-compression,aiomonitor-task-snapshots-diff,awilix-async-container-initialization"
          REST15="arktype-json-schema-refs-dependencies,boa-hierarchical-evaluation-cancellation,abs-stepped-slices,katex-multicolumn-array-spans,fd-deterministic-multi-key-sorting,bandit-interprocedural-taint-checks,fastapi-implicit-head-options,go-git-worktree-merge-conflicts,happy-dom-abort-pending-body-reads,helm-array-merge-strategies,httpx-streaming-json-iteration,kysely-window-grouping-helpers,cattrs-partial-structuring-recovery,expr-try-catch-errors,drizzle-orm-window-function-builders"
          if [ "$STAGE" = first5 ]; then
            echo "tasks=$FIRST5" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$FIRST5_RUN_ID" | grep -Eq '^[0-9]+$'; then
            echo "::error title=Gate::rest15 needs first5_run_id (a successful first5 run)"; exit 1
          fi
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FIRST5_RUN_ID")"
          path="$(printf '%s' "$run" | python3 -c 'import json,sys; print(json.load(sys.stdin)["path"])')"
          conclusion="$(printf '%s' "$run" | python3 -c 'import json,sys; print(json.load(sys.stdin)["conclusion"])')"
          title="$(printf '%s' "$run" | python3 -c 'import json,sys; print(json.load(sys.stdin)["display_title"])')"
          case "$path" in "$WORKFLOW_PATH"*) ;; *) echo "::error title=Gate::run $FIRST5_RUN_ID is $path, not $WORKFLOW_PATH"; exit 1;; esac
          case "$title" in *"| first5 |"*) ;; *) echo "::error title=Gate::run $FIRST5_RUN_ID is not a first5 run: $title"; exit 1;; esac
          if [ "$conclusion" != success ]; then
            echo "::error title=Gate::first5 run $FIRST5_RUN_ID concluded $conclusion; rest15 runs only after first5 goes"; exit 1
          fi
          echo "tasks=$REST15" >> "$GITHUB_OUTPUT"

  mirror_plan:
    needs: gate
    if: ${{ inputs.gt_delivery_mode != 'thin' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - name: Map the stage's tasks to their pinned images
        id: images
        env:
          TASKS: ${{ needs.gate.outputs.tasks }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          catalog = json.load(open("config/deepswe_task_catalog_v1.json", encoding="utf-8"))
          rows = {row["task_id"]: row for row in catalog["tasks"]}
          # abs-module-cache-flags's image is also the readiness fixture image.
          wanted = [t for t in os.environ["TASKS"].split(",") if t] + ["abs-module-cache-flags"]
          images = sorted({(rows[t]["container_image"], rows[t]["container_digest"]) for t in wanted})
          # Each image gets three independent jobs. A GitHub runner whose IP
          # has exhausted public ECR's anonymous data quota can never copy on
          # retry (DeepSWE rest15, run 36312794672: three images failed five
          # retries each with "Data limit exceeded"); separate jobs usually
          # land on other runners. A job finding the digest mirrored exits.
          matrix = [{"image": image, "digest": digest, "attempt": attempt}
                    for image, digest in images for attempt in (1, 2, 3)]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("images=" + json.dumps({"include": matrix}, separators=(",", ":")) + chr(10))
          PY

  mirror:
    # Copy each image into this account's GHCR by digest. crane copy keeps the
    # manifest bytes, so <mirror>@<digest> is the identical image; readiness,
    # the digest gate and every task pull read it before public ECR, whose
    # anonymous per-IP rate and data limits a shared runner IP may have used
    # up ("toomanyrequests: Data limit exceeded"). Already-mirrored digests
    # are skipped. A failure here warns - consumers still fall back to ECR.
    needs: mirror_plan
    if: ${{ inputs.gt_delivery_mode != 'thin' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.mirror_plan.outputs.images) }}
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Mirror the image by digest
        env:
          SRC_IMAGE: ${{ matrix.image }}
          DIGEST: ${{ matrix.digest }}
          GHCR_TOKEN: ${{ github.token }}
          MIRROR: ghcr.io/${{ github.repository_owner }}/deepswe-v1-1
        run: |
          set -uo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install github.com/google/go-containerregistry/cmd/crane@v0.20.3
          crane="$RUNNER_TEMP/bin/crane"
          "$crane" auth login ghcr.io -u "${{ github.actor }}" -p "$GHCR_TOKEN"
          if [ "$("$crane" digest "${MIRROR}@${DIGEST}" 2>/dev/null)" = "$DIGEST" ]; then
            echo "already mirrored: ${MIRROR}@${DIGEST}"; exit 0
          fi
          TAG="${SRC_IMAGE##*:}"
          for delay in 0 30 90; do
            sleep "$delay"
            if "$crane" copy "${SRC_IMAGE}@${DIGEST}" "${MIRROR}:${TAG}"; then
              got="$("$crane" digest "${MIRROR}@${DIGEST}")"
              if [ "$got" = "$DIGEST" ]; then echo "mirrored ${MIRROR}@${DIGEST}"; exit 0; fi
              echo "::error title=Mirror digest::copied ${TAG} but mirror reports ${got}"; exit 1
            fi
            echo "::warning title=Mirror copy::${SRC_IMAGE} retry after ${delay}s"
          done
          echo "::error title=Mirror copy::${SRC_IMAGE}@${DIGEST} could not be copied"; exit 1

  gt_on:
    needs: [gate, mirror]
    # A failed mirror leaves ECR as the (throttle-prone) fallback; say so in
    # the mirror job, but still run.
    if: ${{ always() && needs.gate.result == 'success' && inputs.gt_delivery_mode != 'thin' }}
    uses: ./.github/workflows/deepswe_gt_delivery_ab.yml
    # Its nested image-mirror job writes this account's GHCR (5ac9188b); a
    # called workflow can use no more than its caller job grants, and GitHub
    # validates it at startup even when this job is skipped.
    permissions:
      contents: read
      packages: write
      actions: read
    secrets: inherit
    with:
      approve_paid_run: ${{ inputs.approve_paid_run }}
      tasks: ${{ needs.gate.outputs.tasks }}
      arms: ${{ inputs.gt_delivery_mode }}
      n_runs: "1"
      max_parallel: "5"
      model: ${{ inputs.model }}
      reasoning_effort: ${{ inputs.reasoning_effort }}
      step_limit: ${{ inputs.step_limit }}

  # Thin: the space-bunny baseline's own harness plus GT observations on the
  # agent's actions (gt_engine.thin_agent; GitNexus shape). Steps are the
  # baseline's, not a launch input.
  thin:
    needs: gate
    if: ${{ needs.gate.result == 'success' && inputs.gt_delivery_mode == 'thin' }}
    uses: ./.github/workflows/deepswe_thin_gt.yml
    secrets: inherit
    with:
      tasks: ${{ inputs.thin_tasks }}
      model: ${{ inputs.model }}
      # The baselines ran 20 at a time; parallelism changes no task's budget.
      parallel: "20"
