name: "GT benchmark portable provider-free acceptance"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-free-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GT_GITNEXUS_ROOT: ${{ github.workspace }}/.pinned/gitnexus
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Recorded-content attestation resolves the three historical renderer
          # commits and their trees. A shallow checkout makes valid provenance
          # indistinguishable from missing history.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable product pins from manifest
        id: product-pins
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          manifest = json.loads(Path("config/deepswe_product_bundle_v1.json").read_text(encoding="utf-8"))
          pins = {
              "groundtruth_commit": manifest["groundtruth"]["source_commit"],
              "groundtruth_tree": manifest["groundtruth"]["source_tree"],
              "producer_sha": manifest["groundtruth"]["producer_sha256"],
              "python_version": manifest["python_version"],
              "review_inbox_commit": manifest["groundtruth"]["lineage_exception"]["review_inbox_commit"],
          }
          git_pins = (
              pins["groundtruth_commit"],
              pins["groundtruth_tree"],
              pins["review_inbox_commit"],
          )
          if not all(re.fullmatch(r"[0-9a-f]{40}", value) for value in git_pins):
              raise SystemExit("product_manifest_git_pin_invalid")
          if not re.fullmatch(r"[0-9a-f]{64}", pins["producer_sha"]):
              raise SystemExit("product_manifest_producer_digest_invalid")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for key, value in pins.items():
                  output.write(f"{key}={value}\n")
          PY

      - name: Install exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ steps.product-pins.outputs.python_version }}
          cache: pip

      - name: Verify imported 921bec20 product objects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          manifest = json.loads(Path("config/tb2_gt_import_manifest.json").read_text(encoding="utf-8-sig"))
          assert manifest["gt_source_commit"] == "921bec20d3dbabd12e4b442936d9259c24cdcc74"
          observed = {}
          for path, expected in manifest["source_object_ids"].items():
              actual = subprocess.check_output(
                  ["git", "rev-parse", f"HEAD:{path}"], text=True
              ).strip()
              if actual != expected:
                  raise SystemExit(f"GT_SOURCE_OBJECT_MISMATCH: {path}: {actual} != {expected}")
              observed[path] = actual
          Path("provider-free-source-objects.json").write_text(
              json.dumps({
                  "schema": "gt.benchmark_provider_free.v1",
                  "head_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                  "gt_source_commit": manifest["gt_source_commit"],
                  "source_object_ids": observed,
              }, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Checkout immutable GitNexus capability source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: abhigyanpatwari/GitNexus
          ref: 7e993ab8972386294fb96bf14a8665d0b5325397
          path: .pinned/gitnexus
          persist-credentials: false

      - name: Checkout exact Groundtruth producer source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: harneet2512/groundtruth
          ref: ${{ steps.product-pins.outputs.groundtruth_commit }}
          path: .pinned/groundtruth
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact review-inbox evidence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: harneet2512/gt-harness
          ref: ${{ steps.product-pins.outputs.review_inbox_commit }}
          path: .pinned/review-inbox
          persist-credentials: false

      - name: Verify vendored Groundtruth producer identity
        env:
          SOURCE_COMMIT: ${{ steps.product-pins.outputs.groundtruth_commit }}
          SOURCE_TREE: ${{ steps.product-pins.outputs.groundtruth_tree }}
        run: |
          set -euo pipefail
          SOURCE_ROOT="${GITHUB_WORKSPACE}/.pinned/groundtruth"
          OUTPUT_ROOT="${GITHUB_WORKSPACE}/artifacts/source-bound-producer"
          # Verify source identity
          test "$(git -C "${SOURCE_ROOT}" rev-parse HEAD)" = "${SOURCE_COMMIT}"
          test "$(git -C "${SOURCE_ROOT}" rev-parse HEAD^{tree})" = "${SOURCE_TREE}"
          # Use the vendored binary (built by CI run 33856088171) rather than
          # rebuilding — Go CGO static builds are not byte-reproducible across
          # different runner instances. The vendored binary IS a CI artifact;
          # this step verifies its identity matches the bundle.
          mkdir -p "${OUTPUT_ROOT}"
          cp vendor/gt-index-linux-amd64 "${OUTPUT_ROOT}/gt-index-linux-amd64"
          cp vendor/gt-index-linux-amd64.build-info.json "${OUTPUT_ROOT}/build-info.json"
          chmod +x "${OUTPUT_ROOT}/gt-index-linux-amd64"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path("artifacts/source-bound-producer")
          binary = root / "gt-index-linux-amd64"
          info = json.loads((root / "build-info.json").read_text(encoding="utf-8"))
          digest = hashlib.sha256(binary.read_bytes()).hexdigest()
          manifest = json.loads(Path("config/deepswe_product_bundle_v1.json").read_text(encoding="utf-8"))
          expected = manifest["groundtruth"]
          assert info["schema"] == "gt-index.build.v1"
          assert info["complete"] is True
          # The producer binary is bound to producer_build.source_commit, not
          # to groundtruth.source_commit: a Python-only wheel patch can move
          # the source pin without requiring a (non-reproducible) Go rebuild.
          assert info["git_commit"] == expected["producer_build"]["source_commit"]
          assert info["go_toolchain"] == "go1.22.5"
          assert info["build_tags"] == expected["producer_build"]["build_tags"]
          assert info["graph_schema_version"] == "v15.2-trust-tier"
          assert info["executable_sha256"] == digest
          assert digest == expected["producer_sha256"]
          assert hashlib.sha256((root / "build-info.json").read_bytes()).hexdigest() == expected["producer_build"]["build_info_sha256"]
          assert (root / "build-info.json").read_bytes() == Path(expected["producer_build"]["build_info_path"]).read_bytes()
          assert binary.read_bytes() == Path(expected["producer_path"]).read_bytes()
          (root / "sha256.txt").write_text(digest + "\n", encoding="utf-8")
          PY
          file "${OUTPUT_ROOT}/gt-index-linux-amd64" | grep -F 'statically linked'

      - name: Verify Groundtruth lineage and review provenance
        run: |
          set -euo pipefail
          python -m scripts.verify_groundtruth_provenance \
            --manifest config/deepswe_product_bundle_v1.json \
            --groundtruth-checkout .pinned/groundtruth \
            --review-checkout .pinned/review-inbox \
            --output artifacts/source-bound-producer/lineage-measurement.json

      - name: Configure isolated Git fixtures
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            '+refs/heads/*:refs/remotes/origin/*'
          # The two fixture commits live on a side lineage that no branch
          # reaches, so a bare-SHA fetch depends on the server still holding
          # them as reachable objects - it does not. They are carried by the
          # fixtures/* tags on the campaign remotes; fetch those refs first,
          # then the SHA fetch and the cat-file pins below are satisfied from
          # objects already present. Found by the offline final check-up:
          # a --no-local clone of the landed head did not carry them.
          git fetch --force --no-tags origin \
            '+refs/tags/fixtures/har41-e56c7ef1:refs/tags/fixtures/har41-e56c7ef1' \
            '+refs/tags/fixtures/har64-7bbbc9d0:refs/tags/fixtures/har64-7bbbc9d0'
          git fetch --force --no-tags origin \
            e56c7ef17eaffee36c80ff4dde4f0cd3991c4dcd \
            7bbbc9d0b7f02f8cdaab79ad82ee86884b738eb5
          git cat-file -e e56c7ef17eaffee36c80ff4dde4f0cd3991c4dcd^{commit}
          git cat-file -e 7bbbc9d0b7f02f8cdaab79ad82ee86884b738eb5^{commit}
          git config --global user.name "GT Harness CI"
          git config --global user.email "gt-harness-ci@example.invalid"
          git config core.hooksPath "${GITHUB_WORKSPACE}/.githooks"
          # The hook directory is branch-local: a ref that carries no
          # .githooks/pre-commit is a legitimate state, not a defect. The chmod
          # is therefore guarded on the file's presence rather than having its
          # exit status swallowed -- a chmod that fails on a file that IS
          # present still reds the job, which a suppressed failure would not.
          # On THIS ref the file is shipped and its index mode is 100755, so
          # the guard is true and the chmod runs; the guard stays because the
          # step is also reached from refs that predate the hook.
          if [ -f .githooks/pre-commit ]; then
            chmod +x .githooks/pre-commit
          fi

      - name: Restore the exact DeepSWE task image cache
        id: restore-task-image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/deepswe-task-image.tar.zst
          key: deepswe-task-image-v1-3a4d47f5281269305343c83729836ac2f3172811aee72681e472a4196178eda1

      - name: Load the cached DeepSWE task image
        if: steps.restore-task-image.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          zstd --decompress --stdout "${RUNNER_TEMP}/deepswe-task-image.tar.zst" |
            docker load
          # `docker save` of a digest reference may restore only an image ID.
          # Re-fetch the immutable manifest so Docker binds that cached layer set
          # to the exact repository digest before any container can start.
          docker pull \
            'public.ecr.aws/d3j8x8q7/swe-bench-202605:kh75679ajj3b8dtd7se3h7z0a1833y6r-v1.1@sha256:3a4d47f5281269305343c83729836ac2f3172811aee72681e472a4196178eda1'
          docker image inspect \
            'public.ecr.aws/d3j8x8q7/swe-bench-202605:kh75679ajj3b8dtd7se3h7z0a1833y6r-v1.1@sha256:3a4d47f5281269305343c83729836ac2f3172811aee72681e472a4196178eda1' \
            >/dev/null

      - name: Install the frozen provider-free test surface
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --require-hashes -r config/product-requirements.lock
          python -m pip install --disable-pip-version-check --no-deps .
          python -m pip install --disable-pip-version-check --no-deps \
            vendor/groundtruth_mcp-1.0.0-py3-none-any.whl
          python -c "import importlib.metadata as m; assert m.version('mini-swe-agent') == '2.4.6'; assert m.version('harbor') == '0.20.0'; assert m.version('datacurve-pier') == '0.3.1'"
          python -c "import groundtruth; print(groundtruth.__file__)"

      - name: Prove static workflow reachability and closed secret boundary
        run: |
          set -euo pipefail
          python -m scripts.validate_product_workflow \
            --workflow .github/workflows/deepswe_gt_harness_product.yml
          python -m scripts.validate_product_workflow \
            --workflow .github/workflows/deepswe_gt_harness_product_p0731.yaml

      - name: Validate paid workflow structure and dependencies
        run: |
          set -euo pipefail
          python scripts/verify/workflow_lint.py \
            .github/workflows/tb2_miniswe_central.yml \
            .github/workflows/swebench_live_lite_full.yml \
            .github/workflows/swelive_gt_harness_paid.yaml

      - name: Prove the producer binary matches its declared source
        run: |
          set -euo pipefail
          # Gates on defects that are decidable here: the shipped binary must
          # match its declared digest, be present, and carry complete pins.
          # The source binding itself resolves only against the producer
          # repository, which is not checked out in CI; that is reported as
          # undecided rather than failed, so this cannot red the pipeline over
          # the ordinary fact that the producer lives elsewhere.
          python -m scripts.verify_producer_binding --enforce

      - name: Validate failure IDs and canonical RED evidence production
        run: |
          set -euo pipefail
          PYTHON_EXE="${pythonLocation}/bin/python"
          "$PYTHON_EXE" scripts/validate_failure_ids.py . \
            --ledger-snapshot config/failure_id_ledger_snapshot.json \
            --expected-ledger-revision sha256:86fe88f99aef31db9214a9c82364936fb1523a465043aee0c3b325fa823c6eb6 \
            --expected-ledger-payload-sha256 3aefe224c70975266cdc777d231bc4ecb8b3fa38e98d7921d4ffcb5f6a2c7592 \
            --expected-next FD-031
          "$PYTHON_EXE" scripts/check_red_evidence_producers.py --root .
          CAPTURE_JSON="$("$PYTHON_EXE" scripts/red_evidence.py capture \
            --root tests/fixtures/red_evidence_go \
            --source proof_red_test.go \
            --fixture go.mod \
            --command-json '["go","test","-count=1","-p=1","./..."]' \
            --toolchain-command-json '["go","version"]' \
            --expected-source-path proof_red_test.go \
            --expected-diagnostic 'undefined: VTAFlowProof' \
            --runner-image ubuntu-24.04 \
            --runner-image-version "${ImageVersion}" \
            --runner-architecture "${RUNNER_ARCH}" \
            --evidence-dir "${RUNNER_TEMP}/red-artifact")"
          RECEIPT_SHA="$(printf '%s' "$CAPTURE_JSON" | "$PYTHON_EXE" -c 'import json,sys; print(json.load(sys.stdin)["receipt_sha256"])')"
          "$PYTHON_EXE" scripts/red_evidence.py verify \
            --root tests/fixtures/red_evidence_go \
            --evidence-dir "${RUNNER_TEMP}/red-artifact" \
            --expected-receipt-sha256 "$RECEIPT_SHA" \
            --replay

      - name: Re-derive recorded delivery content offline
        run: |
          set -euo pipefail
          python -m scripts.verify_recorded_delivery_content \
            --fixture tests/fixtures/har81_attestation/content_recordings.json \
            --output artifacts/a21-preflight/har81-a21-content-measurement.json
          python -c "import json; from pathlib import Path; p=json.loads(Path('artifacts/a21-preflight/har81-a21-content-measurement.json').read_text()); assert p['schema'] == 'gt.recorded_content_measurement.v3'; assert p['provider_calls'] == 0; assert p['run_count'] == 3; assert p['renderer_provenance_match_count'] == 3; assert p['delivery_count'] == 12; assert p['payload_match_count'] == 12; assert p['historical_adjudication_count'] == 5; assert p['mismatch_count'] == 0; assert p['attestation_match_count'] == p['delivery_count']; assert set(p['mutation_cases'].values()) == {'FAIL_AS_DESIGNED'}; assert p['status'] == 'PASS'"

      - name: Run deterministic bare and Groundtruth arms
        run: |
          set -euo pipefail
          python scripts/gt_product_acceptance.py \
            --manifest config/deepswe_product_bundle_v1.json \
            --fake-provider \
            --output artifacts/product-closeout
          python -c "import json; from pathlib import Path; p=json.loads(Path('artifacts/product-closeout/product-closeout.json').read_text()); assert p['provider_calls'] == 0; assert p['benchmark_runs'] == 0; assert p['status'] == 'VERIFIED_PROVIDER_FREE'; assert p['release_eligible'] is True; assert p['release_blockers'] == []; assert p['content_correctness']['packet_digest_sha256'] == json.loads(Path('artifacts/product-closeout/har81-a21-content-measurement.json').read_text())['packet_digest_sha256']; assert p['secret_canary_matches'] == []"

      - name: Stage the exact DeepSWE task image for caching
        if: steps.restore-task-image.outputs.cache-hit != 'true'
        id: stage-task-image
        run: |
          set -euo pipefail
          IMAGE_REF='public.ecr.aws/d3j8x8q7/swe-bench-202605:kh75679ajj3b8dtd7se3h7z0a1833y6r-v1.1@sha256:3a4d47f5281269305343c83729836ac2f3172811aee72681e472a4196178eda1'
          IMAGE_SIZE="$(docker image inspect --format '{{.Size}}' "${IMAGE_REF}")"
          if [ "${IMAGE_SIZE}" -gt 4000000000 ]; then
            echo "Exact task image exceeds the 4 GB cache safety limit; cache not written."
            echo "cacheable=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          docker save "${IMAGE_REF}" |
            zstd --threads=0 --fast=1 --stdout > "${RUNNER_TEMP}/deepswe-task-image.tar.zst"
          test -s "${RUNNER_TEMP}/deepswe-task-image.tar.zst"
          echo "cacheable=true" >> "${GITHUB_OUTPUT}"

      - name: Save the exact DeepSWE task image cache
        if: steps.restore-task-image.outputs.cache-hit != 'true' && steps.stage-task-image.outputs.cacheable == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/deepswe-task-image.tar.zst
          key: deepswe-task-image-v1-3a4d47f5281269305343c83729836ac2f3172811aee72681e472a4196178eda1

      - name: Stage the verified producer outside the source closure
        env:
          EXPECTED_PRODUCER_SHA: ${{ steps.product-pins.outputs.producer_sha }}
        run: |
          set -euo pipefail
          PRODUCER_PATH="/opt/groundtruth/gt-index/gt-index"
          sudo install -D -m 0755 vendor/gt-index-linux-amd64 "${PRODUCER_PATH}"
          printf '%s  %s\n' \
            "${EXPECTED_PRODUCER_SHA}" \
            "${PRODUCER_PATH}" | sha256sum --check --strict
          "${PRODUCER_PATH}" -h >/dev/null

      - name: Verify the complete feature proof matrix
        run: |
          python scripts/issue_feature_matrix.py
          python scripts/verify_feature_matrix.py

      # Named-first gate for the repository content the suite below cannot
      # run without. These tests read files that are NOT produced by the
      # build: .githooks/{failure-gate.json,install,pre-commit,post-commit,
      # hook-installation.receipt.json},
      # docs/historical-workflows/gt_finalstand_provider_free.yml (whose bytes
      # are pinned by gt_finalstand/receipts/fs023_provenance.json ->
      # workflow_definition_sha256) and the SWE-bench-Live task corpus under
      # swelive-bench/tasks/. They used to be untracked, so
      # "Run the full Python suite serially" could never go green on a clean
      # checkout. Running them BY NAME first costs seconds and names the
      # regression in the log before the ~30-minute serial suite starts; the
      # full suite below still runs them, so this is a fast failure, not a
      # substitute. Nothing is deselected from the full suite.
      #
      # The `--collect-only` sweep leads because a missing file read at MODULE
      # scope aborts COLLECTION, not a test: pytest exits 2 having run nothing
      # and every named selection below is never reached, so the serial suite
      # fails with no named cause. tests/test_swelive_corpus.py did exactly
      # that - it loads its grader from
      # swelive-bench/tasks/cyclotruc__gitingest-94/tests/grade.py at import
      # time. Collecting the whole tree first costs seconds and names it.
      - name: Check shipped hook, corpus and archived-workflow content is present
        env:
          GT_INDEX_BINARY: /opt/groundtruth/gt-index/gt-index
        run: |
          set -euo pipefail
          python -m pytest --collect-only -q tests
          python -m pytest -q -ra \
            "tests/test_failure_ids.py::test_common_hook_installation_and_post_commit_contract_are_tracked" \
            "tests/test_failure_ids.py::test_pre_commit_direct_command_bootstraps_repository_import_path" \
            "tests/test_failure_ids.py::test_shipped_manifest_matches_gate_refusal_contract" \
            "tests/test_failure_ids.py::test_shipped_manifest_preserves_verdict_coverage_refusals" \
            "tests/test_failure_id_validator.py::test_repository_snapshot_and_ci_are_wired" \
            "tests/test_gt_finalstand.py::test_finalstand_is_machine_valid" \
            "tests/test_gt_finalstand.py::test_fs023_provenance_cross_binds_terminal_workflow_and_artifact" \
            "tests/test_gt_finalstand.py::test_fs023_completion_is_rejected_while_workflow_linkage_is_missing" \
            "tests/test_gt_finalstand.py::test_fs023_future_terminal_provenance_requires_cross_bound_actions_receipt" \
            "tests/test_gt_finalstand.py::test_fs023_github_api_confirmation_verifies_run_artifact_and_members" \
            "tests/test_gt_finalstand.py::test_fs023_artifact_rejects_duplicate_traversal_and_stale_receipts" \
            "tests/test_gt_finalstand.py::test_historical_provider_free_workflow_is_archived_with_immutable_identity" \
            "tests/test_historical_workflow_blob.py" \
            "tests/test_swelive_corpus.py"

      - name: Run the full Python suite serially
        env:
          GT_INDEX_BINARY: /opt/groundtruth/gt-index/gt-index
        run: |
          set -euo pipefail
          python -m pytest -q -ra tests

      - name: Seal pre-spend provider-free certification
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(
              Path("provider-free-source-objects.json").read_text(encoding="utf-8")
          )
          source.update({
              "status": "PASS",
              "checks": {
                  "source_binding": "PASS",
                  "workflow_dependencies": "PASS",
                  "progress_parser_fixtures": "PASS",
                  "resource_attestation": "PASS",
                  "final_attestation": "PASS",
                  "artifact_contract": "PASS",
                  "miniswe_product_integration": "PASS",
              },
          })
          Path("provider-free-certification.json").write_text(
              json.dumps(source, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload provider-free receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gt-benchmark-provider-free-${{ github.run_id }}
          path: provider-free-certification.json
          if-no-files-found: error
          retention-days: 90

      - name: Seal provider-free workflow receipt
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = {
              "schema": "gt.workflow_run_receipt.v1",
              "run_id": int("${{ github.run_id }}"),
              "head_sha": "${{ github.sha }}",
              "status": "${{ job.status }}",
              "provider_calls": 0,
              "benchmark_runs": 0,
          }
          Path("artifacts/product-closeout").mkdir(parents=True, exist_ok=True)
          Path("artifacts/product-closeout/workflow-run.json").write_text(
              json.dumps(receipt, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload provider-free closeout
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gt-product-provider-free-${{ github.run_id }}
          path: artifacts/product-closeout/
          if-no-files-found: error

      - name: Upload source-bound producer bootstrap
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gt-source-bound-producer-${{ github.run_id }}
          path: artifacts/source-bound-producer/
          if-no-files-found: error
