# Terminal-Bench 2.0 MINI-SWE CENTRAL RUNTIME matrix, one job per task.
#
# Uses the already-frozen 2026-07-31 baseline only as a post-hoc comparator and
# runs the host-owned GT treatment control plane
# (eval.gt_central_agent:MiniSweCentralAgent). Private runtime
# code, state, provider credentials, and feature configuration stay on the
# Harbor host; only literal model-selected Bash commands enter the task image.
#
# Promotion-capable runs use one immutable task profile from the frozen
# baseline. Arbitrary subsets are diagnostic-only and cannot emit a verdict.
# --agent-timeout-multiplier 1.0. This workflow has no baseline-generation arm.
name: TB2 miniswe central matrix (GT-on)

on:
  workflow_dispatch:
    inputs:
      comparison_profile:
        description: "Frozen comparison denominator"
        type: choice
        options: [repair20-v1]
        default: repair20-v1
      parallel:
        description: "Max concurrent task jobs (GHA concurrency cap)"
        type: string
        default: "10"
      ref:
        description: "Exact treatment commit or branch; blank freezes the dispatch commit"
        type: string
        default: ""
      replay_capture:
        description: "Capture bounded provider requests/responses for deterministic trajectory replay (paid; default off)"
        type: boolean
        default: false
      provider_preflight_timeout_sec:
        description: "Provider preflight timeout for this run; increase for queued TokenRouter routes"
        type: string
        default: "600"

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.freeze.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
      - id: freeze
        name: Freeze exact treatment commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  provider_free:
    needs: resolve
    uses: ./.github/workflows/central_provider_free.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  plan:
    needs: [resolve, provider_free]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tasks: ${{ steps.enum.outputs.tasks }}
      task_set_sha256: ${{ steps.enum.outputs.task_set_sha256 }}
      canary_model: ${{ steps.canary_identity.outputs.model }}
      canary_provider: ${{ steps.canary_identity.outputs.provider }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_BASE_URL: https://api.deepseek.com
      GT_LITELLM_MODEL: openai/deepseek-v4-flash
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ github.token }}
      GT_INDEX_BINARY: ${{ github.workspace }}/vendor/gt-index-linux-amd64
      SNOWFLAKE_MODEL_REVISION: 7802add0519e4bf94c46ef23552176697c7a1ac7
      SNOWFLAKE_MODEL_SHA256: 564e6c65ee0c739a486702e9e3e9b33c3f697c19c34dbe886bce9eec497ce971
      SNOWFLAKE_TOKENIZER_SHA256: 91f1def9b9391fdabe028cd3f3fcc4efd34e5d1f08c3bf2de513ebb5911a1854
      GT_DENSE_INTRA_OP_THREADS: "4"
      GT_DENSE_INTER_OP_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/gt-index-src/go.mod
          cache-dependency-path: vendor/gt-index-src/go.sum

      - name: Build certified gt-index from the checked-out source
        working-directory: vendor/gt-index-src
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          go build -tags sqlite_fts5 -o "$RUNNER_TEMP/gt-index" ./cmd/gt-index/
          chmod +x "$RUNNER_TEMP/gt-index"
          echo "GT_INDEX_BINARY=$RUNNER_TEMP/gt-index" >> "$GITHUB_ENV"

      - name: Install nano-harness + harbor
        run: |
          python -m pip install --upgrade pip
          chmod +x vendor/gt-index-linux-amd64
          python -m pip install -e '.[retrieval]' "mini-swe-agent==2.2.8" "harbor==0.20.0" \
            vendor/groundtruth_mcp-*.whl

      - name: Provision pinned Snowflake ONNX runtime asset
        run: |
          set -euo pipefail
          model_dir="$RUNNER_TEMP/snowflake-arctic-embed-m"
          mkdir -p "$model_dir"
          gh release download gt-retrieval-runtime-v1 \
            --repo harneet2512/gt-harness \
            --pattern model.onnx --pattern tokenizer.json --pattern manifest.json \
            --dir "$model_dir"
          echo "$SNOWFLAKE_MODEL_SHA256  $model_dir/model.onnx" | sha256sum -c -
          echo "$SNOWFLAKE_TOKENIZER_SHA256  $model_dir/tokenizer.json" | sha256sum -c -

      - name: Prove repository intelligence substrate
        run: python scripts/verify_gt_index_runtime.py

      - name: Prove pinned language contract
        run: python scripts/verify_tb2_language_contract.py

      - name: Sanitize API keys (strip BOM / stray whitespace)
        run: |
          python - <<'EOF'
          import os, sys

          cleaned, notes = [], []
          for name in ("OPENAI_API_KEY", "DEEPSEEK_API_KEY", "ANTHROPIC_API_KEY"):
              raw = os.environ.get(name) or ""
              if not raw:
                  continue
              clean = raw.replace("\ufeff", "").strip()
              if clean != raw:
                  notes.append(f"{name}: removed {len(raw) - len(clean)} stray char(s)")
              if not clean.isascii():
                  print(f"::error::{name} holds non-ASCII characters after stripping "
                        "BOM/whitespace - it cannot be sent as an HTTP header")
                  sys.exit(1)
              cleaned.append((name, clean))

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for name, clean in cleaned:
                  print(f"::add-mask::{clean}")
                  f.write(f"{name}={clean}\n")
          for n in notes:
              print(f"::warning::{n}")
          EOF

      - name: Prove exact persistent bootstrap provider contract (gates all jobs)
        env:
          MODEL: deepseek-v4-flash
          PROVIDER_PREFLIGHT_TIMEOUT_SEC: ${{ inputs.provider_preflight_timeout_sec }}
        run: |
          set -euo pipefail
          # This is the exact runtime bootstrap path: one forced select_catalog
          # tool selection, the production parser, request hashes, provider identity,
          # and no executor action. A generic text completion cannot certify it.
          timeout --signal=TERM "${PROVIDER_PREFLIGHT_TIMEOUT_SEC}s" \
            python -m scripts.central_bootstrap_canary \
              --model "$MODEL" \
              --timeout-sec "$PROVIDER_PREFLIGHT_TIMEOUT_SEC" \
              --output bootstrap-canary.json

      - id: canary_identity
        name: Export observed bootstrap canary identity
        run: |
          python - <<'EOF'
          import json, os
          from pathlib import Path

          payload = json.loads(Path("bootstrap-canary.json").read_text(encoding="utf-8"))
          identity = ((payload.get("receipt") or {}).get("response_identity") or {})
          model = str(identity.get("model") or "")
          provider = str(identity.get("provider") or "")
          if model != "deepseek-v4-flash" or provider != "openai":
              raise SystemExit("::error::bootstrap canary observed identity mismatch")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"model={model}\nprovider={provider}\n")
          EOF

      - name: Upload exact bootstrap proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-canary-${{ github.run_id }}
          path: bootstrap-canary.json
          if-no-files-found: error

      - name: Enumerate dataset tasks
        id: enum
        env:
          DATASET: terminal-bench@2.0
          COMPARISON_PROFILE: ${{ inputs.comparison_profile }}
        run: |
          set -euo pipefail
          harbor dataset download "$DATASET" -o ds --export
          python - <<'EOF'
          import json, os
          from pathlib import Path

          from scripts.tb2_promotion_gate import task_set_sha256

          dataset = os.environ["DATASET"]
          root = Path("ds") / dataset.split("@", 1)[0]
          available = {p.name for p in root.iterdir() if p.is_dir()}
          if not available:
              raise SystemExit(f"::error::no tasks found under {root}")

          baseline = json.loads(
              Path("eval/frozen_baselines/tb2_miniswe_20260731.json").read_text(
                  encoding="utf-8"
              )
          )
          profile_id = os.environ["COMPARISON_PROFILE"]
          profile = baseline["manifest"]["profiles"][profile_id]
          tasks = sorted(
              row["task"] for row in baseline["rows"]
          ) if profile.get("task_source") == "all_rows" else sorted(profile["task_ids"])
          missing = sorted(set(tasks) - available)
          if missing:
              raise SystemExit(f"::error::profile tasks absent from dataset: {missing}")
          digest = task_set_sha256(tasks)
          if len(tasks) != profile["task_count"] or digest != profile["task_set_sha256"]:
              raise SystemExit("::error::frozen comparison profile failed count/hash validation")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"tasks={json.dumps(tasks)}\n")
              f.write(f"task_set_sha256={digest}\n")

          summary = [f"## Plan: {len(tasks)} tasks as individual jobs", ""]
          summary.append("`" + ", ".join(tasks) + "`")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(summary) + "\n")
          print("\n".join(summary))
          EOF

  run:
    needs: [resolve, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix:
        task: ${{ fromJson(needs.plan.outputs.tasks) }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_BASE_URL: https://api.deepseek.com
      GT_LITELLM_MODEL: openai/deepseek-v4-flash
      PYTHONUTF8: "1"
      GT_INDEX_BINARY: ${{ github.workspace }}/vendor/gt-index-linux-amd64
      SNOWFLAKE_MODEL_REVISION: 7802add0519e4bf94c46ef23552176697c7a1ac7
      SNOWFLAKE_MODEL_SHA256: 564e6c65ee0c739a486702e9e3e9b33c3f697c19c34dbe886bce9eec497ce971
      SNOWFLAKE_TOKENIZER_SHA256: 91f1def9b9391fdabe028cd3f3fcc4efd34e5d1f08c3bf2de513ebb5911a1854
      GT_DENSE_INTRA_OP_THREADS: "4"
      GT_DENSE_INTER_OP_THREADS: "1"
      # Provider credentials remain on the Harbor host. The external agent
      # passes an empty env mapping to every model-selected task command.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/gt-index-src/go.mod
          cache-dependency-path: vendor/gt-index-src/go.sum

      - name: Build certified gt-index from the checked-out source
        working-directory: vendor/gt-index-src
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          go build -tags sqlite_fts5 -o "$RUNNER_TEMP/gt-index" ./cmd/gt-index/
          chmod +x "$RUNNER_TEMP/gt-index"
          echo "GT_INDEX_BINARY=$RUNNER_TEMP/gt-index" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af

      - name: Install nano-harness + harbor
        run: |
          python -m pip install --upgrade pip
          chmod +x vendor/gt-index-linux-amd64
          python -m pip install -e '.[retrieval]' "mini-swe-agent==2.2.8" "harbor==0.20.0" \
            vendor/groundtruth_mcp-*.whl

      - name: Provision pinned Snowflake ONNX runtime asset in task job
        run: |
          set -euo pipefail
          model_dir="$RUNNER_TEMP/snowflake-arctic-embed-m"
          mkdir -p "$model_dir"
          gh release download gt-retrieval-runtime-v1 \
            --repo harneet2512/gt-harness \
            --pattern model.onnx --pattern tokenizer.json --pattern manifest.json \
            --dir "$model_dir"
          echo "$SNOWFLAKE_MODEL_SHA256  $model_dir/model.onnx" | sha256sum -c -
          echo "$SNOWFLAKE_TOKENIZER_SHA256  $model_dir/tokenizer.json" | sha256sum -c -
          MODEL_DIR="$model_dir" python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["MODEL_DIR"])
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          expected = {
              "model": "Snowflake/snowflake-arctic-embed-m",
              "revision": os.environ["SNOWFLAKE_MODEL_REVISION"],
              "model_sha256": os.environ["SNOWFLAKE_MODEL_SHA256"],
              "tokenizer_sha256": os.environ["SNOWFLAKE_TOKENIZER_SHA256"],
          }
          for key, value in expected.items():
              if str(manifest.get(key) or "") != value:
                  raise SystemExit(f"manifest mismatch for {key}: {manifest.get(key)!r}")
          if manifest.get("inference_api") is not False:
              raise SystemExit("pinned asset manifest must prove inference_api=false")
          PY

      - name: Verify pinned dense backend before Mini-SWE
        run: |
          set -euo pipefail
          MODEL_DIR="$RUNNER_TEMP/snowflake-arctic-embed-m" python - <<'PY'
          import json, os
          from pathlib import Path

          from gt_engine.snowflake_onnx import SnowflakeOnnxDenseBackend

          root = Path(os.environ["MODEL_DIR"])
          backend = SnowflakeOnnxDenseBackend.from_directory(root)
          query = backend.embed_query("verify the repository implementation")
          passage = backend.embed_documents(("def verify_repository(): pass",))[0]
          if not query or not passage:
              raise SystemExit("Snowflake backend returned an empty embedding")
          receipt = backend.receipt()
          if receipt.get("network_calls") or receipt.get("provider_calls"):
              raise SystemExit("dense backend made a network/provider call")
          proof = {
              "schema": "gt.snowflake_dense_backend_proof.v1",
              "available": True,
              "identity": backend.identity,
              "model_revision": os.environ["SNOWFLAKE_MODEL_REVISION"],
              "model_sha256": os.environ["SNOWFLAKE_MODEL_SHA256"],
              "tokenizer_sha256": os.environ["SNOWFLAKE_TOKENIZER_SHA256"],
              "receipt": receipt,
              "query_dimensions": len(query),
              "passage_dimensions": len(passage),
          }
          Path("dense-backend-proof.json").write_text(
              json.dumps(proof, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(proof, sort_keys=True))
          PY

      - name: Prove repository intelligence substrate
        run: python scripts/verify_gt_index_runtime.py

      - name: Prove pinned language contract
        run: python scripts/verify_tb2_language_contract.py

      - name: Sanitize API keys (strip BOM / stray whitespace)
        run: |
          python - <<'EOF'
          import os, sys

          cleaned = []
          for name in ("OPENAI_API_KEY", "DEEPSEEK_API_KEY", "ANTHROPIC_API_KEY"):
              raw = os.environ.get(name) or ""
              if not raw:
                  continue
              clean = raw.replace("\ufeff", "").strip()
              if not clean.isascii():
                  print(f"::error::{name} holds non-ASCII characters after stripping")
                  sys.exit(1)
              cleaned.append((name, clean))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for name, clean in cleaned:
                  print(f"::add-mask::{clean}")
                  f.write(f"{name}={clean}\n")
          EOF

      - name: Restore task image from cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/tb2-img.tar.gz
          key: tb2-img-${{ matrix.task }}-20251031

      - name: Load cached task image
        if: steps.restore.outputs.cache-hit == 'true'
        run: |
          docker load -i "${{ runner.temp }}/tb2-img.tar.gz"
          echo "loaded task image from cache for ${{ matrix.task }}"

      - name: Resolve Harbor's exact task-owned agent budget
        env:
          DATASET: terminal-bench@2.0
          TASK: ${{ matrix.task }}
        run: |
          set -euo pipefail
          harbor dataset download "$DATASET" -o ds --export
          DATASET_NAME="${DATASET%@*}"
          TASK_CONFIG="ds/${DATASET_NAME}/${TASK}/task.toml"
          mkdir -p results/terminal-bench
          EXECUTION_BUDGET=$(python scripts/resolve_harbor_budget.py \
            --task-config "$TASK_CONFIG" \
            --multiplier 1.0 \
            --output "results/terminal-bench/harbor-budget-${TASK}.json")
          echo "EXECUTION_BUDGET=${EXECUTION_BUDGET}" >> "$GITHUB_ENV"
          echo "resolved Harbor agent budget: ${EXECUTION_BUDGET}s"

      - name: Run harbor - task ${{ matrix.task }}
        id: harbor
        env:
          MODEL: deepseek-v4-flash
          DATASET: terminal-bench@2.0
          TASK: ${{ matrix.task }}
          REPLAY_CAPTURE: ${{ inputs.replay_capture }}
          STEP_LIMIT: "100"
        run: |
          set -uo pipefail
          AGENT="eval.gt_central_agent:MiniSweCentralAgent"
          FEATURE_ARGS=(
            --ak integration_mode=active --ak policy_mode=certified_active
            --ak enable_all_features=true --ak enable_submit_readiness=true
            --ak enable_repository_intelligence=true
            --ak preflight_mode=assistive_safe --ak enable_lint=true
            --ak enable_feature_guidance=true --ak enable_context_frontier=true
            --ak enable_preemptive_retrieval=true
            --ak enable_decision_sufficiency=true
            --ak enable_persistent_execution_state=true
            --ak persistent_state_bootstrap_timeout_sec=45
            --ak persistent_state_bootstrap_input_tokens=2000
            --ak persistent_state_bootstrap_output_tokens=512
            --ak persistent_state_context_tokens=512
            --ak preemptive_retrieval_model_dir="$RUNNER_TEMP/snowflake-arctic-embed-m"
            --ak enable_context_compaction=true --ak enable_completion_controller=true
            --ak enable_progress_control=true --ak enable_adaptive_validation_timeout=true
            --ak enable_shadow_submit_gate=true
            --ak require_graph_ready=true
          )
          FEATURE_ARGS+=(
            --ak execution_budget_sec="$EXECUTION_BUDGET"
            --ak enable_task_start_advisory=false
            --ak enable_replay_capture="$REPLAY_CAPTURE"
            --ak step_limit="$STEP_LIMIT"
          )
          JOB_NAME="tb2-miniswe-central-certified_full-integrated-${GITHUB_RUN_ID}-${TASK}"
          echo "job_name=${JOB_NAME}" >> "$GITHUB_OUTPUT"

          harbor run \
            -d "$DATASET" \
            --agent-import-path "$AGENT" \
            -m "$MODEL" \
            -o results/terminal-bench \
            --job-name "$JOB_NAME" \
            --agent-timeout-multiplier 1.0 \
            -n 1 \
            -y \
            "${FEATURE_ARGS[@]}" \
            -i "$TASK"

      - name: Cache task image for future runs
        if: steps.restore.outputs.cache-hit != 'true'
        id: saveimg
        env:
          TASK: ${{ matrix.task }}
          IMAGE_TAG: "20251031"
        run: |
          IMG="alexgshaw/${TASK}:${IMAGE_TAG}"
          set +e
          SIZE=$(docker image inspect --format '{{.Size}}' "$IMG" 2>/dev/null)
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "image $IMG not present; nothing to cache"
            exit 0
          fi
          if [ "$SIZE" -gt 1500000000 ]; then
            echo "image ${TASK} is $SIZE bytes (>1.5GB); skipping cache to protect the budget"
            exit 0
          fi
          docker save "$IMG" | gzip -1 > "${{ runner.temp }}/tb2-img.tar.gz"
          echo "cached=1" >> "$GITHUB_OUTPUT"
          echo "saved ${TASK} image ($SIZE bytes) for future runs"

      - name: Upload task image cache
        if: steps.restore.outputs.cache-hit != 'true' && steps.saveimg.outputs.cached == '1'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/tb2-img.tar.gz
          key: tb2-img-${{ matrix.task }}-20251031

      - name: Fix artifact permissions
        if: always()
        run: |
          # Some task verifiers still return root-owned result artifacts.
          sudo find results -type f -exec chmod a+r {} + 2>/dev/null || \
            sudo chmod -R a+r results || true

      - name: Disk after run
        if: always()
        run: df -h /

      - name: Upload task result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb2-miniswe-central-certified_full-integrated-${{ github.run_id }}-task-${{ matrix.task }}
          path: |
            results/terminal-bench/
            dense-backend-proof.json
          if-no-files-found: warn

  merge:
    needs: [resolve, plan, run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all task artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tb2-miniswe-central-certified_full-integrated-${{ github.run_id }}-task-*
          path: tasks
          merge-multiple: false

      - name: Merge task results
        env:
          EXPECTED_TASKS_JSON: ${{ needs.plan.outputs.tasks }}
          TASK_SET_SHA256: ${{ needs.plan.outputs.task_set_sha256 }}
          COMPARISON_PROFILE: ${{ inputs.comparison_profile }}
          CANARY_MODEL: ${{ needs.plan.outputs.canary_model }}
          CANARY_PROVIDER: ${{ needs.plan.outputs.canary_provider }}
          GT_COMMIT: ${{ needs.resolve.outputs.sha }}
          GT_RUN_ID: ${{ github.run_id }}
        # The merge implementation lives in scripts/tb2_merge_results.py to
        # stay below GitHub's expression-size limit. These anchors keep the
        # fail-closed release contract reviewable at the dispatch surface:
        # invalid_intelligence = [; out = [; harbor_result=got[0] if got else None
        # audit_treatment_runtime; build_feature_lifecycle_report;
        # assess_tb2_promotion; invalid_treatment_release_tasks;
        # fingerprint drift does not excuse a baseline loss.
        # from gt_engine.delivery_audit import audit_provider_deliveries
        # dense_receipt.get("available") is True; dense_proof.get("available") is True
        # provider_delivery_failures; invalid_provider_deliveries;
        # invalid_intelligence or invalid_dense or invalid_provider_deliveries
        # INVALID TREATMENT RELEASE; invalid_treatment_release;
        # not lifecycle_report["passed"]; not promotion_report.passed;
        # call1_gt_changed_tasks; This is intervention accounting.
        run: python scripts/tb2_merge_results.py

      - name: Upload merged result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb2-miniswe-central-certified_full-integrated-${{ github.run_id }}-MERGED
          path: |
            merged.json
            SUMMARY.md
            deep_metrics_*.json
            feature_lifecycle_report.json
            tb2_treatment.json
            promotion_report.json
            regression_forensics.json
          if-no-files-found: warn
