name: "TB2 GT smoke20: Union Alpha on 921bec20"
run-name: "TB2-GT ${{ inputs.cohort_stage }} | unbiased/pareto | 921bec20 | p20"

on:
  workflow_dispatch:
    inputs:
      cohort_stage:
        description: "Run gate-one first; release remaining-19 only after an official grade"
        required: true
        type: choice
        options: [gate-one, remaining-19, all-20]
        default: gate-one

permissions:
  contents: read
  actions: read
  packages: read

env:
  TREATMENT_SHA: ${{ github.sha }}
  GT_SOURCE_SHA: 921bec20d3dbabd12e4b442936d9259c24cdcc74
  MODEL: unbiased/pareto
  DATASET: terminal-bench@2.0
  IMAGE_TAG: "20251031"
  TIMEOUT_MULTIPLIER: "5.0"
  STEP_LIMIT: "100"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  provider_free:
    uses: ./.github/workflows/deepswe_gt_harness_product.yml

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tasks: ${{ steps.plan.outputs.tasks }}
      task_set_sha256: ${{ steps.plan.outputs.task_set_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TREATMENT_SHA }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the official Harbor planner
        run: python -m pip install --disable-pip-version-check "harbor==0.20.0"

      - name: Freeze the canonical repair20 matrix and task budgets
        id: plan
        shell: bash
        env:
          COHORT_STAGE: ${{ inputs.cohort_stage }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TREATMENT_SHA"
          harbor dataset download "$DATASET" -o "$RUNNER_TEMP/tb2-plan" --export
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from scripts.resolve_harbor_budget import SUPERVISOR_GRACE_SECONDS, resolve_budget

          tasks = [
              "extract-elf", "mcmc-sampling-stan", "prove-plus-comm",
              "qemu-alpine-ssh", "regex-chess", "sanitize-git-repo",
              "torch-tensor-parallelism", "video-processing",
              "winning-avg-corewars", "write-compressor", "headless-terminal",
              "portfolio-optimization", "schemelike-metacircular-eval",
              "cobol-modernization", "llm-inference-batching-scheduler",
              "fix-code-vulnerability", "feal-linear-cryptanalysis",
              "count-dataset-tokens", "largest-eigenval",
              "torch-pipeline-parallelism",
          ]
          expected_hash = "36d5c8945f6f8d9ae23fe2cea759f16da0c0cea424a98f710cfaa0d9d6fd0303"
          digest = hashlib.sha256(("\n".join(sorted(tasks)) + "\n").encode()).hexdigest()
          if digest != expected_hash or len(tasks) != 20 or len(set(tasks)) != 20:
              raise SystemExit("repair20 task identity mismatch")
          stage = os.environ["COHORT_STAGE"]
          selected = {
              "gate-one": tasks[:1],
              "remaining-19": tasks[1:],
              "all-20": tasks,
          }.get(stage)
          if selected is None:
              raise SystemExit(f"unsupported cohort stage: {stage}")
          dataset = Path(os.environ["RUNNER_TEMP"]) / "tb2-plan" / "terminal-bench"
          available = {p.name for p in dataset.iterdir() if p.is_dir()}
          missing = sorted(set(tasks) - available)
          if missing:
              raise SystemExit(f"tasks absent from terminal-bench@2.0: {missing}")
          rows = []
          for ordinal, task in enumerate(selected, 1):
              budget = resolve_budget(dataset / task / "task.toml", multiplier=5.0)
              rows.append({
                  "ordinal": ordinal,
                  "task": task,
                  "time_budget_seconds": max(
                      30,
                      int(float(budget["execution_budget_sec"]) - float(SUPERVISOR_GRACE_SECONDS)),
                  ),
                  "task_config_sha256": budget["task_config_sha256"],
              })
          receipt = {
              "schema": "gt.tb2_gt_smoke20_plan.v1",
              "treatment_sha": os.environ["TREATMENT_SHA"],
              "gt_source_sha": os.environ["GT_SOURCE_SHA"],
              "model": os.environ["MODEL"],
              "effective_model": "openai/unbiased/pareto",
              "dataset": os.environ["DATASET"],
              "cohort_stage": stage,
              "task_count": len(selected),
              "task_ids": selected,
              "full_task_count": 20,
              "full_task_ids": tasks,
              "task_set_sha256": digest,
              "parallel": min(20, len(selected)),
              "attempts_per_task": 1,
              "agent": "eval.pier_gt_harness_adapter:PierGtHarnessMiniSwe246Agent",
              "agent_scaffold": "mini-swe-agent",
              "agent_scaffold_version": "2.4.6",
              "timeout_multiplier": 5.0,
              "step_limit": 100,
              "validation_run": True,
              "matrix": rows,
          }
          Path("tb2-gt-smoke20-plan.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          matrix = json.dumps({"include": rows}, separators=(",", ":"))
          tasks_json = json.dumps(selected, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"matrix={matrix}\n")
              out.write(f"tasks={tasks_json}\n")
              out.write(f"task_set_sha256={digest}\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: tb2-gt-smoke20-plan-${{ github.run_id }}
          path: tb2-gt-smoke20-plan.json
          if-no-files-found: error

  pre_spend:
    needs: [plan, provider_free]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      context_window_tokens: ${{ steps.provider.outputs.context_window_tokens }}
      reserved_output_tokens: ${{ steps.provider.outputs.reserved_output_tokens }}
      context_window_source: ${{ steps.provider.outputs.context_window_source }}
      provider_routing_json: ${{ steps.provider.outputs.provider_routing_json }}
    env:
      TASK: extract-elf
      PYTHONPATH: ${{ github.workspace }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_NEW }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TREATMENT_SHA }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the locked GT product and official runtimes
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --require-hashes -r config/product-requirements.lock
          test "$(python -c 'import importlib.metadata as m; print(m.version("datacurve-pier"))')" = "0.3.1"
          test "$(python -c 'import importlib.metadata as m; print(m.version("harbor"))')" = "0.20.0"
          test "$(python -c 'import importlib.metadata as m; print(m.version("mini-swe-agent"))')" = "2.4.6"

      - name: Prove the exact treatment adapter and environment contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from eval.pier_filtered_docker import PierFilteredDockerEnvironment
          from eval.pier_gt_harness_adapter import PierGtHarnessMiniSwe246Agent

          agent = PierGtHarnessMiniSwe246Agent
          environment = PierFilteredDockerEnvironment
          assert agent.__module__ == "eval.pier_gt_harness_adapter"
          assert agent.__name__ == "PierGtHarnessMiniSwe246Agent"
          assert agent.MINISWE_AGENT_VERSION == "2.4.6"
          assert hasattr(environment, "agent_process_env")
          PY

      - name: Restore the existing verifier-canary image cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/tb2-img.tar.gz
          key: tb2-img-${{ env.TASK }}-${{ env.IMAGE_TAG }}

      - name: Load the cached verifier-canary image
        if: steps.restore.outputs.cache-hit == 'true'
        run: docker load -i "${{ runner.temp }}/tb2-img.tar.gz"

      - name: Pull the existing GHCR verifier-canary mirror only on cache miss
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mirror="ghcr.io/${{ github.repository_owner }}/tb2.${TASK}:${IMAGE_TAG}"
          canonical="alexgshaw/${TASK}:${IMAGE_TAG}"
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
          docker pull "$mirror"
          docker tag "$mirror" "$canonical"
          docker save "$canonical" | gzip -1 > "${{ runner.temp }}/tb2-img.tar.gz"

      - name: Save the verifier-canary image for paid task reuse
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/tb2-img.tar.gz
          key: tb2-img-${{ env.TASK }}-${{ env.IMAGE_TAG }}

      - name: Export the exact official verifier-canary task package
        run: |
          set -euo pipefail
          harbor dataset download "$DATASET" -o "$RUNNER_TEMP/tb2-pre-spend" --export
          test -f "$RUNNER_TEMP/tb2-pre-spend/terminal-bench/$TASK/task.toml"

      - name: Run the real official verifier through Pier without a model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/pre-spend
          pier run \
            -p "$RUNNER_TEMP/tb2-pre-spend/terminal-bench" \
            -a nop \
            --environment-import-path eval.pier_filtered_docker:PierFilteredDockerEnvironment \
            -o results/pre-spend \
            --job-name "tb2-gt-pre-spend-${GITHUB_RUN_ID}" \
            -n 1 -l 1 -y \
            -i "$TASK"

      - name: Parse and validate official-verifier evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.benchmark_progress emit-harbor \
            --root results/pre-spend \
            --task-id "$TASK" \
            --model "nop" \
            --effective-model "harbor/nop" \
            --treatment-sha "$TREATMENT_SHA" \
            --gt-source-sha "$GT_SOURCE_SHA" \
            --output pre-spend-progress.json
          python - <<'PY'
          import json, os
          from pathlib import Path

          progress = json.loads(Path("pre-spend-progress.json").read_text(encoding="utf-8"))
          task = progress["tasks"][0]
          assert task["task_id"] == "extract-elf"
          assert task["official_verifier"] is True
          assert task["state"] in {"passed", "verifier_failed"}
          assert task["reward"] in {0, 1}
          PY

      - name: Sanitize the OpenRouter key before the live route gate
        run: |
          python - <<'PY'
          import os
          clean = os.environ.get("OPENROUTER_API_KEY", "").replace("\ufeff", "").strip()
          if not clean or not clean.isascii():
              raise SystemExit("OPENROUTER_API_KEY is missing or invalid")
          print(f"::add-mask::{clean}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"OPENROUTER_API_KEY={clean}\n")
          PY

      - name: Prove the locked Union Alpha route with a live canary
        id: provider
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.provider_preflight \
            --manifest config/provider_route_unbiased_pareto.v1.json \
            --output provider-preflight.json \
            --source-sha "$TREATMENT_SHA" \
            --live
          python - <<'PY'
          import json, os
          from pathlib import Path

          receipt = json.loads(Path("provider-preflight.json").read_text(encoding="utf-8"))
          assert receipt["status"] == "PASS"
          assert receipt["provider_ready"] is True
          assert receipt["model"] == "unbiased/pareto"
          assert receipt["provider_routing"] == {
              "only": ["stealth"],
              "allow_fallbacks": False,
              "require_parameters": True,
          }
          values = {
              "context_window_tokens": receipt["context_window_tokens"],
              "reserved_output_tokens": receipt["reserved_output_tokens"],
              "context_window_source": receipt["context_window_source"],
              "provider_routing_json": json.dumps(
                  receipt["provider_routing"], separators=(",", ":")
              ),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for name, value in values.items():
                  out.write(f"{name}={value}\n")
          PY

      - name: Seal the complete pre-spend certification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          progress = json.loads(Path("pre-spend-progress.json").read_text(encoding="utf-8"))
          task = progress["tasks"][0]
          provider = json.loads(Path("provider-preflight.json").read_text(encoding="utf-8"))
          receipt = {
              "schema": "gt.benchmark_pre_spend.v1",
              "status": "PASS",
              "treatment_sha": os.environ["TREATMENT_SHA"],
              "gt_source_sha": os.environ["GT_SOURCE_SHA"],
              "dataset": os.environ["DATASET"],
              "canary_task": task,
              "checks": {
                  "exact_pier_environment_executed": "PASS",
                  "official_verifier_executed": "PASS",
                  "parser_accepted_official_evidence": "PASS",
                  "infrastructure_classification": "PASS",
                  "provider_route_live_canary": "PASS",
                  "provider_canary_requests": provider["provider_inference_calls"],
                  "task_model_requests": 0,
              },
              "provider_preflight": provider,
          }
          Path("pre-spend-certification.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Persist the pre-spend verifier chain
        uses: actions/upload-artifact@v4
        with:
          name: tb2-gt-pre-spend-${{ github.run_id }}
          path: |
            pre-spend-certification.json
            pre-spend-progress.json
            provider-preflight.json
            results/pre-spend/
          if-no-files-found: error
          retention-days: 90

  run:
    needs: [plan, pre_spend]
    runs-on: ubuntu-latest
    timeout-minutes: 600
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TASK: ${{ matrix.task }}
      PYTHONPATH: ${{ github.workspace }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_NEW }}
      OPENAI_API_KEY: ${{ secrets.OPENROUTER_NEW }}
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      GT_PROVIDER_CONTEXT_WINDOW_TOKENS: ${{ needs.pre_spend.outputs.context_window_tokens }}
      GT_PROVIDER_RESERVED_OUTPUT_TOKENS: ${{ needs.pre_spend.outputs.reserved_output_tokens }}
      GT_PROVIDER_CONTEXT_WINDOW_SOURCE: ${{ needs.pre_spend.outputs.context_window_source }}
      GT_PROVIDER_ROUTING_JSON: ${{ needs.pre_spend.outputs.provider_routing_json }}
      GT_RETRIEVAL_MODE: hybrid_required
      GT_TREATMENT: groundtruth
      GT_JOURNAL_TEE: "1"
      MINISWE_AGENT_VERSION: "2.4.6"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TREATMENT_SHA }}
          fetch-depth: 1

      - name: Prove exact treatment source
        run: test "$(git rev-parse HEAD)" = "$TREATMENT_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af

      - name: Install the locked GT product and official Harbor runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --require-hashes -r config/product-requirements.lock
          test "$(python -c 'import importlib.metadata as m; print(m.version("mini-swe-agent"))')" = "2.4.6"
          test "$(python -c 'import importlib.metadata as m; print(m.version("harbor"))')" = "0.20.0"

      - name: Restore the existing TB2 task image cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/tb2-img.tar.gz
          key: tb2-img-${{ matrix.task }}-${{ env.IMAGE_TAG }}

      - name: Load the cached task image
        if: steps.restore.outputs.cache-hit == 'true'
        run: docker load -i "${{ runner.temp }}/tb2-img.tar.gz"

      - name: Pull the existing GHCR mirror only on cache miss
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mirror="ghcr.io/${{ github.repository_owner }}/tb2.${TASK}:${IMAGE_TAG}"
          canonical="alexgshaw/${TASK}:${IMAGE_TAG}"
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
          docker pull "$mirror"
          docker tag "$mirror" "$canonical"

      - name: Require the exact task image before paid execution
        run: docker image inspect "alexgshaw/${TASK}:${IMAGE_TAG}" >/dev/null

      - name: Stage the verified uv installer
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/uv-install-0.11.32.tar.gz"
          curl -fsSL -o "$installer" \
            https://releases.astral.sh/github/uv/releases/download/0.11.32/uv-x86_64-unknown-linux-gnu.tar.gz
          echo "aab924fd522efd06f1c5f3b93a243864fc453132c94b2dc49f1371b528a4b967  $installer" | sha256sum -c -
          echo "GT_UV_INSTALLER_HOST=$installer" >> "$GITHUB_ENV"

      - name: Stage the verified Python runtime
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cpython-3.12.13-20260718.tar.gz"
          curl -fsSL -o "$archive" \
            'https://github.com/astral-sh/python-build-standalone/releases/download/20260718/cpython-3.12.13%2B20260718-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz'
          echo "5854aa6ec71cad00334d5065633c210b2e7feb40956767a59a91791cadcf0b79  $archive" | sha256sum -c -
          echo "GT_PYTHON_ARCHIVE_HOST=$archive" >> "$GITHUB_ENV"

      - name: Stage the pinned task dependency wheelhouse
        run: |
          set -euo pipefail
          wheelhouse="$RUNNER_TEMP/gt-wheelhouse"
          mkdir -p "$wheelhouse"
          python -m pip download --only-binary=:all: --dest "$wheelhouse" \
            "mini-swe-agent==2.4.6" "numpy==2.5.1" \
            "onnxruntime==1.20.1" "tokenizers==0.23.1" \
            "anthropic==0.120.2" "openai==2.50.0" \
            "pydantic==2.13.4" "rich==15.0.0" \
            "mcp==1.27.1" "structlog==25.5.0"
          test -n "$(find "$wheelhouse" -type f -print -quit)"
          echo "GT_WHEELHOUSE_HOST=$wheelhouse" >> "$GITHUB_ENV"

      - name: Build and stage the exact treatment bundle
        env:
          BUNDLE_DIR: ${{ runner.temp }}/gt-treatment-bundle
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from gt_harness.product import build_product_bundle
          root = Path.cwd()
          output = Path(os.environ["BUNDLE_DIR"])
          bundle = build_product_bundle(
              root / "config/deepswe_product_bundle_v1.json", output_dir=output
          )
          wheel = output / "dist" / bundle["python_wheel"]["filename"]
          records = {
              "GT_GROUNDTRUTH_WHEEL_HOST": root / bundle["groundtruth"]["wheel_path"],
              "GT_INDEX_BINARY_HOST": root / bundle["groundtruth"]["producer_path"],
              "GT_HARNESS_WHEEL_HOST": wheel,
              "GT_HARNESS_WHEEL_SHA256": bundle["python_wheel"]["sha256"],
          }
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as out:
              for name, value in records.items():
                  out.write(f"{name}={value}\n")
          PY
          test -s "$BUNDLE_DIR/product-bundle.json"

      - name: Provision the pinned local retrieval model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          model_dir="$RUNNER_TEMP/snowflake-arctic-embed-m"
          mkdir -p "$model_dir"
          gh release download gt-retrieval-runtime-v1 \
            --repo harneet2512/gt-harness \
            --pattern model.onnx --pattern tokenizer.json --pattern manifest.json \
            --dir "$model_dir"
          echo "564e6c65ee0c739a486702e9e3e9b33c3f697c19c34dbe886bce9eec497ce971  $model_dir/model.onnx" | sha256sum -c -
          echo "91f1def9b9391fdabe028cd3f3fcc4efd34e5d1f08c3bf2de513ebb5911a1854  $model_dir/tokenizer.json" | sha256sum -c -
          echo "GT_DENSE_MODEL_DIR=$model_dir" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Stage pinned language servers
        run: |
          set -euo pipefail
          lsp_bin="$RUNNER_TEMP/lsp-bin"
          mkdir -p "$lsp_bin"
          GOBIN="$lsp_bin" go install golang.org/x/tools/gopls@v0.23.0
          ra_gz="$RUNNER_TEMP/rust-analyzer.gz"
          curl -fsSL -o "$ra_gz" \
            https://github.com/rust-lang/rust-analyzer/releases/download/2026-08-31/rust-analyzer-x86_64-unknown-linux-gnu.gz
          echo "a775f9edb543bb0c077da339b783e89446092986cde921c9d8e1733b091080c6  $ra_gz" | sha256sum -c -
          gunzip -c "$ra_gz" > "$lsp_bin/rust-analyzer"
          chmod 755 "$lsp_bin"/*
          node_tar="$RUNNER_TEMP/node.tar.xz"
          curl -fsSL -o "$node_tar" https://nodejs.org/dist/v24.20.0/node-v24.20.0-linux-x64.tar.xz
          echo "2f2c0da162318f0de47665410c7c8c2ed3d36c8f3105de4bbc61176c70a7cbf2  $node_tar" | sha256sum -c -
          node_root="$lsp_bin/node-runtime"
          mkdir -p "$node_root"
          tar -xJf "$node_tar" -C "$node_root" --strip-components=1
          "$node_root/bin/npm" install --prefix "$node_root/servers" --no-fund --no-audit \
            pyright@1.1.413 typescript-language-server@6.0.0 typescript@5.9.3
          printf '#!/bin/sh\nexec "%s/bin/node" "%s/servers/node_modules/%s" "$@"\n' \
            "/installed-agent/lsp-bin/node-runtime" "/installed-agent/lsp-bin/node-runtime" \
            "pyright/langserver.index.js" > "$lsp_bin/pyright-langserver"
          printf '#!/bin/sh\nexec "%s/bin/node" "%s/servers/node_modules/%s" "$@"\n' \
            "/installed-agent/lsp-bin/node-runtime" "/installed-agent/lsp-bin/node-runtime" \
            "typescript-language-server/lib/cli.mjs" > "$lsp_bin/typescript-language-server"
          chmod 755 "$lsp_bin/pyright-langserver" "$lsp_bin/typescript-language-server"
          find "$node_root" -type l -delete
          python -m gt_harness.lsp_assets --root "$lsp_bin" --write
          echo "GT_LSP_BIN_HOST=$lsp_bin" >> "$GITHUB_ENV"

      - name: Mint the host-only resource attestation key
        run: |
          python - <<'PY'
          import os, secrets
          key = secrets.token_hex(32)
          print(f"::add-mask::{key}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"GT_RESOURCE_ATTESTATION_KEY={key}\n")
          PY

      - name: Sanitize the OpenRouter key
        run: |
          python - <<'PY'
          import os, sys
          for name in ("OPENROUTER_API_KEY", "OPENAI_API_KEY"):
              raw = os.environ.get(name, "")
              clean = raw.replace("\ufeff", "").strip()
              if not clean or not clean.isascii():
                  raise SystemExit(f"{name} is missing or invalid")
              print(f"::add-mask::{clean}")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
                  out.write(f"{name}={clean}\n")
          PY

      - name: Export the exact official TB2 task package for Pier
        run: |
          set -euo pipefail
          harbor dataset download "$DATASET" -o "$RUNNER_TEMP/tb2-task" --export
          test -f "$RUNNER_TEMP/tb2-task/terminal-bench/$TASK/task.toml"

      - name: Run one official Pier TB2 trial
        id: harbor
        shell: bash
        run: |
          set +e
          mkdir -p results/terminal-bench
          pier run \
            -p "$RUNNER_TEMP/tb2-task/terminal-bench" \
            --agent-import-path eval.pier_gt_harness_adapter:PierGtHarnessMiniSwe246Agent \
            --environment-import-path eval.pier_filtered_docker:PierFilteredDockerEnvironment \
            -m "$MODEL" \
            -o results/terminal-bench \
            --job-name "tb2-gt-smoke20-921bec20-${GITHUB_RUN_ID}-${TASK}" \
            --agent-timeout-multiplier "$TIMEOUT_MULTIPLIER" \
            -n 1 -l 1 --delete -y \
            --ak task_id="$TASK" \
            --ak product_source_sha="$TREATMENT_SHA" \
            --ak max_iterations="$STEP_LIMIT" \
            --ak time_budget_seconds="${{ matrix.time_budget_seconds }}" \
            -i "$TASK"
          rc=$?
          echo "$rc" > harbor-exit-code.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Normalize artifact permissions
        if: always()
        run: sudo find results -type f -exec chmod a+r {} + 2>/dev/null || true

      - name: Emit official-verifier progress receipt
        if: always()
        shell: bash
        run: |
          python -m scripts.benchmark_progress emit-harbor \
            --root results/terminal-bench \
            --task-id "$TASK" \
            --model "$MODEL" \
            --effective-model "openai/unbiased/pareto" \
            --treatment-sha "$TREATMENT_SHA" \
            --gt-source-sha "$GT_SOURCE_SHA" \
            --output benchmark-progress.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-progress-tb2-gt-${{ github.run_id }}-${{ matrix.task }}
          path: benchmark-progress.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tb2-gt-smoke20-921bec20-${{ github.run_id }}-task-${{ matrix.task }}
          path: |
            results/terminal-bench/
            harbor-exit-code.txt
            ${{ runner.temp }}/gt-treatment-bundle/product-bundle.json
          if-no-files-found: warn

  summarize:
    if: always()
    needs: [plan, run]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TREATMENT_SHA }}
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          pattern: benchmark-progress-tb2-gt-${{ github.run_id }}-*
          path: receipts
          merge-multiple: false

      - name: Aggregate the 20 official-verifier receipts
        env:
          expected_tasks_json: ${{ needs.plan.outputs.tasks }}
        run: |
          python -m scripts.benchmark_progress aggregate \
            --root receipts \
            --expected-tasks-json "$expected_tasks_json" \
            --finalize-missing \
            --output tb2-gt-smoke20-summary.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("tb2-gt-smoke20-summary.json")
          out = json.loads(path.read_text(encoding="utf-8"))
          out.update({
              "model": "unbiased/pareto",
              "effective_model": "openai/unbiased/pareto",
              "treatment_sha": os.environ["TREATMENT_SHA"],
              "gt_source_sha": os.environ["GT_SOURCE_SHA"],
          })
          path.write_text(json.dumps(out, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(out, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: tb2-gt-smoke20-921bec20-${{ github.run_id }}-SUMMARY
          path: tb2-gt-smoke20-summary.json
          if-no-files-found: error
