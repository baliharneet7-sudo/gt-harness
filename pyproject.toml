[project]
name = "nano-harness"
version = "0.0.1"
description = "Smallest readable coding-agent loop that scores on benchmarks."
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.40",
  "openai>=1.50",
  "pydantic>=2.7",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.6"]
eval = ["harbor", "swebench"]
# GroundTruth evidence engine (gt_engine/). The distribution is named
# groundtruth-mcp (import name: groundtruth); it is not on PyPI - install from
# the local checkout: `pip install -e D:\Groundtruth`. groundtruth-mcp declares
# requires-python >=3.11; nano's >=3.12 is the binding constraint here.
# numpy: required by the task-start v1r brief leg (pretask.anchor_select);
# absent, the brief abstains correct-or-quiet and every other GT path still runs.
gt = ["groundtruth-mcp", "numpy"]

[project.scripts]
nano = "nano.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nano", "eval", "gt_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
  "gt_all17: deterministic ten-trigger campaign covering all 17 GT identities",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
