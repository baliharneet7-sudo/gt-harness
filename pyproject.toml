[project]
name = "gt-harness"
version = "0.9.0"
description = "Model-agnostic benchmark harness with deterministic repository intelligence."
requires-python = ">=3.12"
dependencies = [
  "anthropic==0.120.2",
  "mcp>=1.0.0,<2.0",
  "openai==2.50.0",
  "pydantic==2.13.4",
  "rich==15.0.0",
  "structlog>=24.0.0,<26.0",
]

[project.optional-dependencies]
dev = ["psutil==7.2.2", "pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.0"]
eval = ["harbor==0.20.0", "swebench==4.1.0"]
# Workflows pin the exact treatment version.  The host-owned central runtime is
# compatible with both the frozen 2.2.8 comparator and the current 2.3 series.
miniswe = ["mini-swe-agent>=2.2.8,<2.4"]
# GroundTruth is first-party source in src/groundtruth. NumPy remains optional:
# the bounded task-start brief abstains correct-or-quiet when it is unavailable.
gt = ["numpy==2.5.1"]
# Local dense retrieval used by the ARB workflow and optional runtime seam.
# The model weights are separately content-addressed; these are inference-only
# packages and never contact a provider.
retrieval = [
  "numpy==2.5.1",
  "onnxruntime==1.28.0",
  "tokenizers==0.23.1",
]

[project.scripts]
gt-harness = "gt_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nano", "eval", "gt_engine", "gt_harness", "src/groundtruth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
  "gt_all17: deterministic ten-trigger campaign covering all 17 GT identities",
  "real_graph: exercises the source-built Go indexer against a real repository",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
